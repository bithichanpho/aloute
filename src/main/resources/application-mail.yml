# Real SMTP is required for registration/email verification.
# Local/demo accounts from DemoDataSeeder do not use this flow.
# For Gmail, use an App Password (not the normal account password).

spring:
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    # Không commit mật khẩu SMTP thật vào source/.env.public.
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT:10000}
          timeout: ${MAIL_TIMEOUT:10000}
          writetimeout: ${MAIL_WRITE_TIMEOUT:10000}

app:
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:ALOUTE <no-reply@localhost>}}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:8080}
