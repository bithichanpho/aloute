
spring:
  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:

      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}

      minimum-idle: ${DB_POOL_MIN_IDLE:1}

      connection-timeout: ${DB_CONNECTION_TIMEOUT:10000}
      idle-timeout: ${DB_IDLE_TIMEOUT:300000}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

        default_schema: ${DB_SCHEMA:public}
  mongodb:
    uri: ${MONGO_URI}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8080}
  # Keep the socket peer address intact; ClientIpResolver trusts X-Forwarded-For
  # only when the immediate peer is in APP_TRUSTED_PROXY_CIDRS.
  forward-headers-strategy: none

jwt:
  secret: ${JWT_SECRET}
  # Short-lived access JWT; refresh tokens handle longer sessions.
  expiration: ${JWT_EXPIRATION:900000}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

app:
  cache:
    redis:
      enabled: ${REDIS_CACHE_ENABLED:true}
    ttl: ${APP_CACHE_TTL:2m}
    feed-ttl: ${APP_FEED_CACHE_TTL:30s}
  seed:
    demo-data: false
  db:
    # PostgreSQL integrity changes are versioned through Flyway in production.
    relationship-migration:
      enabled: ${ALOUTE_DB_RELATIONSHIP_MIGRATION:false}
  migrations:
    legacy-repost:
      enabled: ${ALOUTE_MIGRATE_LEGACY_REPOST:false}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080}
  security:
    cookie-secure: ${APP_SECURITY_COOKIE_SECURE:true}
    encryption-key: ${APP_SECURITY_ENCRYPTION_KEY}
    legacy-encryption-key: ${APP_SECURITY_LEGACY_ENCRYPTION_KEY:}
    user-cache-ttl: ${APP_SECURITY_USER_CACHE_TTL:5s}
    rate-limit:
      # Production refuses auth-sensitive requests if the shared Redis limiter is down.
      redis-required: ${RATE_LIMIT_REDIS_REQUIRED:true}
    # Set APP_TRUSTED_PROXY_CIDRS to the actual immediate proxy CIDRs in each deployed environment.
    trusted-proxy-cidrs: ${APP_TRUSTED_PROXY_CIDRS}
  mail:
    from: ${MAIL_FROM:ALOUTE <no-reply@example.com>}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:8080}
  moderation:
    # Intentionally enabled in production; never silently bypass moderation.
    enabled: true
    service-url: ${MODERATION_SERVICE_URL}
    connect-timeout: ${MODERATION_CONNECT_TIMEOUT:2s}
    read-timeout: ${MODERATION_READ_TIMEOUT:60s}
    upload-media-timeout: ${MODERATION_UPLOAD_MEDIA_TIMEOUT:12s}
    text-timeout: ${MODERATION_TEXT_TIMEOUT:10s}
    max-attempts: ${MODERATION_MAX_ATTEMPTS:5}
    retry-base-delay-seconds: ${MODERATION_RETRY_BASE_DELAY_SECONDS:30}
    lease-seconds: ${MODERATION_LEASE_SECONDS:300}
    api-token: ${MODERATION_API_TOKEN}
