
spring:
  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:

      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}

      minimum-idle: ${DB_POOL_MIN_IDLE:1}

      connection-timeout: ${DB_CONNECTION_TIMEOUT:10000}
      idle-timeout: ${DB_IDLE_TIMEOUT:300000}
  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

        default_schema: ${DB_SCHEMA:public}
  mongodb:
    uri: ${MONGO_URI}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

app:
  seed:
    demo-data: ${ALOUTE_SEED_DEMO_DATA:false}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080}
  security:

    cookie-secure: ${APP_COOKIE_SECURE:true}
  mail:
    from: ${MAIL_FROM:ALOUTE <no-reply@example.com>}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:8080}
  moderation:
    service-url: ${MODERATION_SERVICE_URL:http://localhost:8000}
