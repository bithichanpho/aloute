# Production profile for a persistent Windows/Docker deployment using Supabase Postgres.
spring:
  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # maximum-pool-size: chỉnh theo giới hạn connection của gói Supabase đang dùng
      # (free tier thường giới hạn khá thấp) — đừng đặt cao hơn giới hạn đó.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      # minimum-idle > 0: LUÔN giữ sẵn ít nhất 1 kết nối "ấm" thay vì để pool rỗng khi
      # không có request nào. Với minimum-idle=0 (giá trị cũ), request đầu tiên sau một
      # lúc idle phải bắt tay TCP + SSL handshake tới Supabase TỪ ĐẦU trước khi chạy được
      # câu query đầu tiên — đây là nguyên nhân chính gây cảm giác "load chậm giật cục"
      # ở request đầu tiên sau mỗi lần rảnh.
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      # Giảm từ 30s xuống 10s: pool chỉ có vài connection, nếu bị chiếm hết thì nên báo lỗi
      # nhanh và rõ ràng thay vì bắt người dùng chờ tới 30 giây trong im lặng.
      connection-timeout: ${DB_CONNECTION_TIMEOUT:10000}
      idle-timeout: ${DB_IDLE_TIMEOUT:300000}
  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
        # Keep JPA server-side access isolated from Supabase's Data API surface.
        default_schema: ${DB_SCHEMA:public}
  mongodb:
    uri: ${MONGO_URI}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

app:
  seed:
    demo-data: ${ALOUTE_SEED_DEMO_DATA:false}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080}
  security:
    # Mặc định true ở profile prod: cookie ALOUTE_TOKEN chỉ được trình duyệt gửi qua HTTPS.
    # Chỉ đặt APP_COOKIE_SECURE=false nếu chắc chắn server prod đang chạy HTTP thuần (không khuyến khích).
    cookie-secure: ${APP_COOKIE_SECURE:true}
  mail:
    from: ${MAIL_FROM:ALOUTE <no-reply@example.com>}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:8080}
  moderation:
    service-url: ${MODERATION_SERVICE_URL:http://localhost:8000}