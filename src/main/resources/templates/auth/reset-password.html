
<!DOCTYPE html>
<html lang="vi" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
  
  <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico?v=20261027-bird-v1}">
  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/images/aloute-icon-32.png?v=20261027-bird-v1}">
  <link rel="apple-touch-icon" sizes="180x180" th:href="@{/images/aloute-icon-180.png?v=20261027-bird-v1}">
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <script th:src="@{/js/theme-init.js?v=20261019-global-theme-v1}"></script>
  <title>Đặt lại mật khẩu / ALOUTE</title>
  <link rel="stylesheet" th:href="@{/css/main.css?v=20261027-bird-privacy-v1}">
  <link rel="stylesheet" th:href="@{/vendor/bootstrap-icons/bootstrap-icons.min.css}">
  <link rel="stylesheet" th:href="@{/css/theme.css?v=20261027-bird-privacy-v1}">
  <link rel="stylesheet" th:href="@{/css/auth-form-feedback.css?v=20261025-focus-v1}">
  <script th:src="@{/js/ui.js?v=20261019-global-theme-v1}" defer></script>
</head>
<body class="auth-body">
  <button type="button" class="auth-theme-toggle" data-theme-toggle aria-label="Chuyển giao diện sáng/tối" title="Chuyển giao diện sáng/tối">
    <i class="bi bi-moon-stars theme-icon theme-icon--to-dark" aria-hidden="true"></i>
    <i class="bi bi-sun theme-icon theme-icon--to-light" aria-hidden="true"></i>
  </button>

  <div class="auth-shell">
    <div class="auth-card auth-error-focus">
      <div class="auth-card__logo">
        <img th:src="@{/images/aloute-bird-logo.png?v=20261027-bird-v1}"
             src="/images/aloute-bird-logo.png" alt="ALOUTE" width="64" height="64">
      </div>
      <h1 class="auth-card__title">Đặt lại mật khẩu</h1>
      <p style="text-align:center;color:var(--text-secondary);font-size:14.5px;margin-top:-8px;margin-bottom:18px;">
        Mã OTP đã được xác thực. Hãy nhập mật khẩu mới cho tài khoản của bạn.
      </p>

      <div id="formError" class="form-error" style="display:none;"></div>
      <div id="formSuccess" class="form-success" style="display:none;"></div>

      <form id="resetForm" novalidate>
        <div class="field">
          <input type="password" id="newPassword" name="newPassword" placeholder="8–72 ký tự, có hoa, thường, số và ký tự đặc biệt" autocomplete="new-password" minlength="8" maxlength="72" required>
        </div>
        <div class="field">
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Xác nhận mật khẩu mới" autocomplete="new-password" minlength="8" maxlength="72" required>
        </div>
        <button type="submit" class="btn-primary" id="submitBtn">Đặt lại mật khẩu</button>
      </form>

      <p class="auth-switch">
        <a th:href="@{/verify-reset-code}">Xác thực lại mã OTP</a> · <a th:href="@{/login}">Đăng nhập</a>
      </p>
    </div>
  </div>

  <script th:src="@{/js/app.js?v=20261027-password-login-v1}"></script>
  <script th:src="@{/js/auth-form-feedback.js?v=20261025-otp-message-v2}"></script>
  <script th:src="@{/js/auth-reset-password.js?v=20261025-reset-v1}"></script>
</body>
</html>
