<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt lại mật khẩu / ALOUTE</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="auth-body">

  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-card__logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3c-4.5 0-7.5 2.9-7.5 7.2 0 3.6 2.2 5.8 4 6.8-.2 1.1-.7 2.4-1.6 3.3 2.3.2 4.3-.6 5.6-1.9 3.7-.3 6.5-3 6.5-6.9C19 6.4 15.9 3 12 3Z"/>
        </svg>
      </div>
      <h1 class="auth-card__title">Đặt lại mật khẩu</h1>

      <div id="missingTokenBox" class="form-error" style="display:none;">
        Thiếu mã đặt lại mật khẩu trong đường dẫn. Vui lòng mở lại link từ email.
      </div>

      <div id="formError" class="form-error" style="display:none;"></div>
      <div id="formSuccess" class="form-success" style="display:none;"></div>

      <form id="resetForm" novalidate>
        <div class="field">
          <input type="password" id="newPassword" name="newPassword" placeholder="Mật khẩu mới (tối thiểu 6 ký tự)" autocomplete="new-password" minlength="6" required>
        </div>
        <div class="field">
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Xác nhận mật khẩu mới" autocomplete="new-password" minlength="6" required>
        </div>
        <button type="submit" class="btn-primary" id="submitBtn">Đặt lại mật khẩu</button>
      </form>

      <p class="auth-switch">
        <a th:href="@{/login}">Về trang đăng nhập</a>
      </p>
    </div>
  </div>

  <script th:src="@{/js/app.js}"></script>
  <script th:inline="javascript">
    const token = /*[[${token}]]*/ null;
    const form = document.getElementById('resetForm');

    if (!token) {
      form.style.display = 'none';
      document.getElementById('missingTokenBox').style.display = 'block';
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      const errorBox = document.getElementById('formError');
      const successBox = document.getElementById('formSuccess');
      const submitBtn = document.getElementById('submitBtn');
      errorBox.style.display = 'none';
      successBox.style.display = 'none';

      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (newPassword.length < 6) {
        errorBox.textContent = 'Mật khẩu mới phải có ít nhất 6 ký tự.';
        errorBox.style.display = 'block';
        return;
      }
      if (newPassword !== confirmPassword) {
        errorBox.textContent = 'Hai mật khẩu nhập vào không khớp.';
        errorBox.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Đang xử lý...';

      try {
        await Aloute.api('/api/auth/reset-password', {
          method: 'POST',
          body: JSON.stringify({ token, newPassword })
        });
        successBox.textContent = 'Đặt lại mật khẩu thành công! Đang chuyển tới trang đăng nhập...';
        successBox.style.display = 'block';
        form.style.display = 'none';
        setTimeout(() => { window.location.href = '/login'; }, 1800);
      } catch (err) {
        errorBox.textContent = err.message || 'Đặt lại mật khẩu thất bại, link có thể đã hết hạn.';
        errorBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Đặt lại mật khẩu';
      }
    });
  </script>
</body>
</html>
