<!DOCTYPE html>
<html lang="vi" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <script th:src="@{/js/theme-init.js?v=20261019-global-theme-v1}"></script>
  <title>Đăng ký / ALOUTE</title>
  <link rel="stylesheet" th:href="@{/css/main.css?v=20261017-moderation-toast-v2}">
  <link rel="stylesheet" th:href="@{/vendor/bootstrap-icons/bootstrap-icons.min.css}">
  <link rel="stylesheet" th:href="@{/css/theme.css?v=20261017-moderation-toast-v2}">
  <link rel="stylesheet" th:href="@{/css/auth-register.css?v=20261024-validation-v1}">
  <script th:src="@{/js/ui.js?v=20261019-global-theme-v1}" defer></script>
</head>
<body class="auth-body">
  <button type="button" class="auth-theme-toggle" data-theme-toggle aria-label="Chuyển giao diện sáng/tối" title="Chuyển giao diện sáng/tối">
    <i class="bi bi-moon-stars theme-icon theme-icon--to-dark" aria-hidden="true"></i>
    <i class="bi bi-sun theme-icon theme-icon--to-light" aria-hidden="true"></i>
  </button>

  <div class="auth-shell">
    <section class="auth-card u244" aria-labelledby="registerTitle">
      <div class="u244-sc">
      <div class="auth-card__logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3c-4.5 0-7.5 2.9-7.5 7.2 0 3.6 2.2 5.8 4 6.8-.2 1.1-.7 2.4-1.6 3.3 2.3.2 4.3-.6 5.6-1.9 3.7-.3 6.5-3 6.5-6.9C19 6.4 15.9 3 12 3Z"/>
        </svg>
      </div>
      <h1 id="registerTitle">Tạo tài khoản ALOUTE</h1>
      <p class="u244-intro">Điền thông tin để nhận mã xác thực qua email.</p>

      <form id="registerForm" novalidate aria-labelledby="registerTitle">
        <div class="u244-sm" id="validationSummary" role="alert" aria-atomic="true" aria-hidden="true" inert>
          <div><div class="u244-sb">
            <b><i aria-hidden="true">!</i><span class="u244-ct"></span></b>
            <ul></ul>
          </div></div>
        </div>
        <div id="formError" class="u244-server-error" role="alert" tabindex="-1" hidden></div>
        <div class="u244-fd" data-field="fullName">
          <label for="fullName">Họ và tên</label>
          <div class="u244-bx">
            <input class="u244-in" type="text" id="fullName" name="fullName" placeholder="Họ và tên" autocomplete="name" maxlength="100" required>
            <span class="u244-ok" aria-hidden="true"></span>
          </div>
          <div class="u244-ms" aria-hidden="true"><div><span id="fullNameError"></span></div></div>
        </div>
        <div class="u244-fd" data-field="username">
          <label for="username">Tên đăng nhập</label>
          <div class="u244-bx">
            <input class="u244-in" type="text" id="username" name="username" placeholder="Tên đăng nhập" autocomplete="username" minlength="3" maxlength="50" required>
            <span class="u244-ok" aria-hidden="true"></span>
          </div>
          <div class="u244-ms" aria-hidden="true"><div><span id="usernameError"></span></div></div>
        </div>
        <div class="u244-fd" data-field="email">
          <label for="email">Email</label>
          <div class="u244-bx">
            <input class="u244-in" type="email" id="email" name="email" placeholder="Email" autocomplete="email" maxlength="254" required>
            <span class="u244-ok" aria-hidden="true"></span>
          </div>
          <div class="u244-ms" aria-hidden="true"><div><span id="emailError"></span></div></div>
        </div>
        <div class="u244-fd" data-field="password">
          <label for="password">Mật khẩu</label>
          <div class="u244-bx">
            <input class="u244-in" type="password" id="password" name="password" placeholder="8–72 ký tự, có hoa, thường, số và ký tự đặc biệt" autocomplete="new-password" minlength="8" maxlength="72" aria-describedby="passwordHelp" required>
            <span class="u244-ok" aria-hidden="true"></span>
          </div>
          <p class="u244-help" id="passwordHelp">8–72 ký tự, có chữ hoa, chữ thường, số và ký tự đặc biệt; tối đa 72 byte UTF-8.</p>
          <div class="u244-ms" aria-hidden="true"><div><span id="passwordError"></span></div></div>
        </div>
        <button type="submit" class="u244-go" id="submitBtn">Đăng ký</button>
      </form>

      <div id="pendingVerificationBox" class="u244-pending" hidden>
        <button type="button" class="u244-resend" id="resendPendingBtn">Gửi lại mã OTP</button>
        <div id="resendPendingMessage" role="status" aria-live="polite"></div>
      </div>

      <p class="u244-switch">
        Đã có tài khoản? <a th:href="@{/login}">Đăng nhập</a>
      </p>
      </div>
    </section>
  </div>

  <script th:src="@{/js/app.js?v=20261017-moderation-toast-v2}"></script>
  <script th:src="@{/js/auth-register.js?v=20261025-business-v2}"></script>
</body>
</html>
