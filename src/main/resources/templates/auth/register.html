<!DOCTYPE html>
<html lang="vi" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <script th:src="@{/js/theme-init.js?v=20261019-global-theme-v1}"></script>
  <title>Đăng ký / ALOUTE</title>
  <link rel="stylesheet" th:href="@{/css/main.css?v=20261017-moderation-toast-v2}">
  <link rel="stylesheet" th:href="@{/vendor/bootstrap-icons/bootstrap-icons.min.css}">
  <link rel="stylesheet" th:href="@{/css/theme.css?v=20261017-moderation-toast-v2}">
  <script th:src="@{/js/ui.js?v=20261019-global-theme-v1}" defer></script>
</head>
<body class="auth-body">
  <button type="button" class="auth-theme-toggle" data-theme-toggle aria-label="Chuyển giao diện sáng/tối" title="Chuyển giao diện sáng/tối">
    <i class="bi bi-moon-stars theme-icon theme-icon--to-dark" aria-hidden="true"></i>
    <i class="bi bi-sun theme-icon theme-icon--to-light" aria-hidden="true"></i>
  </button>

  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-card__logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3c-4.5 0-7.5 2.9-7.5 7.2 0 3.6 2.2 5.8 4 6.8-.2 1.1-.7 2.4-1.6 3.3 2.3.2 4.3-.6 5.6-1.9 3.7-.3 6.5-3 6.5-6.9C19 6.4 15.9 3 12 3Z"/>
        </svg>
      </div>
      <h1 class="auth-card__title">Tạo tài khoản ALOUTE</h1>

      <div id="formError" class="form-error" style="display:none;"></div>

      <form id="registerForm" novalidate>
        <div class="field">
          <input type="text" id="fullName" name="fullName" placeholder="Họ và tên" autocomplete="name" maxlength="100" required>
        </div>
        <div class="field">
          <input type="text" id="username" name="username" placeholder="Tên đăng nhập" autocomplete="username" minlength="3" maxlength="50" required>
        </div>
        <div class="field">
          <input type="email" id="email" name="email" placeholder="Email" autocomplete="email" maxlength="254" required>
        </div>
        <div class="field">
          <input type="password" id="password" name="password" placeholder="8–72 ký tự, có hoa, thường, số và ký tự đặc biệt" autocomplete="new-password" minlength="8" maxlength="72" required>
        </div>
        <button type="submit" class="btn-primary" id="submitBtn">Đăng ký</button>
      </form>

      <div id="pendingVerificationBox" style="display:none;margin-top:12px;">
        <button type="button" class="btn-outline" id="resendPendingBtn">Gửi lại mã OTP</button>
        <div id="resendPendingMessage" style="margin-top:10px;font-size:13.5px;"></div>
      </div>

      <p class="auth-switch">
        Đã có tài khoản? <a th:href="@{/login}">Đăng nhập</a>
      </p>
    </div>
  </div>

  <script th:src="@{/js/app.js?v=20261017-moderation-toast-v2}"></script>
  <script th:src="@{/js/auth-register.js?v=20261019-csp-v1}"></script>
</body>
</html>
