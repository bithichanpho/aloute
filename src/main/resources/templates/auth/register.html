<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký / ALOUTE</title>
  <link rel="stylesheet" th:href="@{/css/main.css?v=20260928-ui-v21}">
</head>
<body class="auth-body">

  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-card__logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3c-4.5 0-7.5 2.9-7.5 7.2 0 3.6 2.2 5.8 4 6.8-.2 1.1-.7 2.4-1.6 3.3 2.3.2 4.3-.6 5.6-1.9 3.7-.3 6.5-3 6.5-6.9C19 6.4 15.9 3 12 3Z"/>
        </svg>
      </div>
      <h1 class="auth-card__title">Tạo tài khoản ALOUTE</h1>

      <div id="formError" class="form-error" style="display:none;"></div>

      <form id="registerForm" novalidate>
        <div class="field">
          <input type="text" id="fullName" name="fullName" placeholder="Họ và tên" autocomplete="name" maxlength="100" required>
        </div>
        <div class="field">
          <input type="text" id="username" name="username" placeholder="Tên đăng nhập" autocomplete="username" minlength="3" maxlength="50" required>
        </div>
        <div class="field">
          <input type="email" id="email" name="email" placeholder="Email" autocomplete="email" maxlength="254" required>
        </div>
        <div class="field">
          <input type="password" id="password" name="password" placeholder="8–72 ký tự, có hoa, thường, số và ký tự đặc biệt" autocomplete="new-password" minlength="8" maxlength="72" required>
        </div>
        <button type="submit" class="btn-primary" id="submitBtn">Đăng ký</button>
      </form>

      <div id="pendingVerificationBox" style="display:none;margin-top:12px;">
        <button type="button" class="btn-outline" id="resendPendingBtn">Gửi lại email xác thực</button>
        <div id="resendPendingMessage" style="margin-top:10px;font-size:13.5px;"></div>
      </div>

      <p class="auth-switch">
        Đã có tài khoản? <a th:href="@{/login}">Đăng nhập</a>
      </p>
    </div>
  </div>

  <script th:src="@{/js/app.js?v=20260928-ui-v21}"></script>
  <script th:inline="javascript">
    const pendingVerificationBox = document.getElementById('pendingVerificationBox');
    const resendPendingBtn = document.getElementById('resendPendingBtn');

    resendPendingBtn.addEventListener('click', async function () {
      const identifier = document.getElementById('email').value.trim() || document.getElementById('username').value.trim();
      const message = document.getElementById('resendPendingMessage');
      if (!identifier) { message.textContent = 'Vui lòng nhập email hoặc tên đăng nhập.'; return; }
      this.disabled = true;
      try {
        const result = await Aloute.api('/api/auth/resend-verification', {
          method: 'POST', body: JSON.stringify({ identifier })
        });
        message.textContent = result?.message || 'Email xác thực mới đã được gửi. Hãy kiểm tra hộp thư.';
      } catch (err) {
        message.textContent = err.message || 'Không thể gửi lại email xác thực.';
      } finally { this.disabled = false; }
    });

    document.getElementById('registerForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const errorBox = document.getElementById('formError');
      const submitBtn = document.getElementById('submitBtn');
      errorBox.style.display = 'none';
      pendingVerificationBox.style.display = 'none';

      const fullName = document.getElementById('fullName').value.trim();
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!fullName || !username || !email || !password) {
        errorBox.textContent = 'Vui lòng điền đầy đủ thông tin.';
        errorBox.style.display = 'block';
        return;
      }
      if (username.length < 3) {
        errorBox.textContent = 'Tên đăng nhập phải từ 3 ký tự trở lên.';
        errorBox.style.display = 'block';
        return;
      }
      if (!/^[A-Za-z0-9_](?:[A-Za-z0-9_.-]{1,48}[A-Za-z0-9_])?$/.test(username)) {
        errorBox.textContent = 'Tên đăng nhập chỉ gồm chữ, số, dấu chấm, gạch dưới hoặc gạch ngang.';
        errorBox.style.display = 'block';
        return;
      }
      if (password.length < 8 || password.length > 72 || !/[A-Z]/.test(password) || !/[a-z]/.test(password) || !/\d/.test(password) || !/[^\p{L}\p{N}\s]/u.test(password)) {
        errorBox.textContent = 'Mật khẩu phải có 8–72 ký tự, gồm chữ hoa, chữ thường, số và ký tự đặc biệt.';
        errorBox.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Đang tạo tài khoản...';

      try {
        await Aloute.api('/api/auth/register', {
          method: 'POST',
          body: JSON.stringify({ fullName, username, email, password })
        });
        window.location.href = '/login?registered=1';
      } catch (err) {
        errorBox.textContent = err.message || 'Đăng ký thất bại, vui lòng thử lại.';
        errorBox.style.display = 'block';
        if ((err.message || '').toLowerCase().includes('chờ xác thực')) {
          pendingVerificationBox.style.display = 'block';
        }
        submitBtn.disabled = false;
        submitBtn.textContent = 'Đăng ký';
      }
    });
  </script>
</body>
</html>
