<!DOCTYPE html>
<html lang="vi" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <script th:src="@{/js/theme-init.js?v=20261019-global-theme-v1}"></script>
  <title>Đăng nhập / ALOUTE</title>
  <link rel="stylesheet" th:href="@{/css/main.css?v=20261017-moderation-toast-v2}">
  <link rel="stylesheet" th:href="@{/vendor/bootstrap-icons/bootstrap-icons.min.css}">
  <link rel="stylesheet" th:href="@{/css/theme.css?v=20261027-merged-source-v1}">
  <link rel="stylesheet" th:href="@{/css/auth-form-feedback.css?v=20261025-focus-v1}">
  <link rel="stylesheet" th:href="@{/css/auth-otp.css?v=20261025-otp-message-v2}">
  <script th:src="@{/js/ui.js?v=20261019-global-theme-v1}" defer></script>
  <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico?v=20261027-bird-v1}">
  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/images/aloute-icon-32.png?v=20261027-bird-v1}">
  <link rel="apple-touch-icon" sizes="180x180" th:href="@{/images/aloute-icon-180.png?v=20261027-bird-v1}">
</head>
<body class="auth-body">
  <button type="button" class="auth-theme-toggle" data-theme-toggle aria-label="Chuyển giao diện sáng/tối" title="Chuyển giao diện sáng/tối">
    <i class="bi bi-moon-stars theme-icon theme-icon--to-dark" aria-hidden="true"></i>
    <i class="bi bi-sun theme-icon theme-icon--to-light" aria-hidden="true"></i>
  </button>

  <div class="auth-shell">
    <div class="auth-card auth-error-focus">
      <div class="auth-card__logo"><img src="/images/aloute-bird-logo.png" alt="ALOUTE" width="58" height="58">
      </div>
      <h1 class="auth-card__title">Đăng nhập ALOUTE</h1>

      <div id="formError" class="form-error" style="display:none;"></div>

      <form id="loginForm" novalidate>
        <div id="credentialsStep">
        <div class="field">
          <input type="text" id="username" name="username" placeholder="Tên đăng nhập hoặc email" autocomplete="username" required>
        </div>
        <div class="field">
          <input type="password" id="password" name="password" placeholder="Mật khẩu" autocomplete="current-password" required>
        </div>
        <p style="text-align:right;margin:-6px 0 14px;">
          <a th:href="@{/forgot-password}" style="font-size:13.5px;">Quên mật khẩu?</a>
        </p>
        </div>
        <div id="twoFactorStep" style="display:none;">
          <p style="color:var(--text-secondary);font-size:14px;margin:0 0 14px;">
            Tài khoản của bạn đã bật xác thực hai lớp. Nhập mã từ ứng dụng Authenticator hoặc một mã khôi phục.
          </p>
          <div class="field">
            <input id="twoFactorCode" name="code" autocomplete="one-time-code" inputmode="numeric" maxlength="64" placeholder="Mã xác thực hoặc mã khôi phục">
          </div>
        </div>
        <button type="submit" class="btn-primary" id="submitBtn">Đăng nhập</button>
        <button type="button" class="btn-outline" id="backToLoginBtn" style="display:none;margin-top:10px;">Quay lại</button>
      </form>

      <div class="auth-firebase-divider" id="googleSignInDivider" hidden><span>hoặc tiếp tục với</span></div>
      <button type="button" class="btn-outline auth-google-btn" id="googleSignInBtn" hidden>
        <i class="bi bi-google" aria-hidden="true"></i> Đăng nhập bằng Google
      </button>
      <p class="auth-integration-status" id="googleSignInStatus" role="status" aria-live="polite"></p>

      <div id="resendVerificationBox" style="display:none;margin-top:14px;">
        <button type="button" class="btn-outline" id="resendVerificationBtn">
          Gửi lại mã OTP
        </button>
        <a class="btn-outline" id="openVerificationBtn" th:href="@{/verify-email}" style="display:block;text-align:center;margin-top:10px;">Nhập mã OTP</a>
        <div id="resendVerificationMessage" style="margin-top:10px;font-size:13.5px;"></div>
      </div>

      <p class="auth-switch">
        Chưa có tài khoản? <a th:href="@{/register}">Đăng ký</a>
      </p>
    </div>
  </div>

  <script th:src="@{/js/app.js?v=20261027-merged-source-v1}"></script>
  <script th:src="@{/js/firebase-client.js?v=20261017-firebase-csp-fix-v1}"></script>
  <script th:src="@{/js/auth-form-feedback.js?v=20261025-otp-message-v2}"></script>
  <script th:src="@{/js/auth-otp.js?v=20261025-input-retry-v3}"></script>
  <script th:src="@{/js/auth-login.js?v=20261025-otp-message-v2}"></script>
</body>
</html>
