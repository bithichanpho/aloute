<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập / ALOUTE</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="auth-body">

  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-card__logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3c-4.5 0-7.5 2.9-7.5 7.2 0 3.6 2.2 5.8 4 6.8-.2 1.1-.7 2.4-1.6 3.3 2.3.2 4.3-.6 5.6-1.9 3.7-.3 6.5-3 6.5-6.9C19 6.4 15.9 3 12 3Z"/>
        </svg>
      </div>
      <h1 class="auth-card__title">Đăng nhập ALOUTE</h1>

      <div id="formError" class="form-error" style="display:none;"></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <input type="text" id="username" name="username" placeholder="Tên đăng nhập hoặc email" autocomplete="username" required>
        </div>
        <div class="field">
          <input type="password" id="password" name="password" placeholder="Mật khẩu" autocomplete="current-password" required>
        </div>
        <p style="text-align:right;margin:-6px 0 14px;">
          <a th:href="@{/forgot-password}" style="font-size:13.5px;">Quên mật khẩu?</a>
        </p>
        <button type="submit" class="btn-primary" id="submitBtn">Đăng nhập</button>
      </form>

      <div id="resendVerificationBox" style="display:none;margin-top:14px;">
        <button type="button" class="btn-outline" id="resendVerificationBtn">
          Gửi lại email xác thực
        </button>
        <div id="resendVerificationMessage" style="margin-top:10px;font-size:13.5px;"></div>
      </div>

      <p class="auth-switch">
        Chưa có tài khoản? <a th:href="@{/register}">Đăng ký</a>
      </p>
    </div>
  </div>

  <script th:src="@{/js/app.js}"></script>
  <script th:inline="javascript">
    const loginForm = document.getElementById('loginForm');
    if (new URLSearchParams(window.location.search).get('registered')) {
      const notice = document.createElement('div');
      notice.className = 'form-success';
      notice.textContent = 'Tài khoản đã được tạo. Hãy xác thực email rồi đăng nhập.';
      loginForm.prepend(notice);
      document.getElementById('resendVerificationBox').style.display = 'block';
    }

    document.getElementById('resendVerificationBtn').addEventListener('click', async function () {
      const identifier = document.getElementById('username').value.trim();
      const message = document.getElementById('resendVerificationMessage');
      if (!identifier) {
        message.textContent = 'Hãy nhập email hoặc tên đăng nhập ở ô phía trên.';
        return;
      }
      this.disabled = true;
      try {
        const result = await Aloute.api('/api/auth/resend-verification', {
          method: 'POST',
          body: JSON.stringify({ identifier })
        });
        message.textContent = result?.message || 'Nếu tài khoản hợp lệ, email mới đã được gửi.';
      } catch (err) {
        message.textContent = err.message || 'Không thể gửi lại email.';
      } finally {
        this.disabled = false;
      }
    });

    loginForm.addEventListener('submit', async function (e) {
      e.preventDefault();
      const errorBox = document.getElementById('formError');
      const submitBtn = document.getElementById('submitBtn');
      errorBox.style.display = 'none';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        errorBox.textContent = 'Vui lòng nhập đầy đủ tên đăng nhập và mật khẩu.';
        errorBox.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Đang đăng nhập...';

      try {
        await Aloute.api('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ username, password })
        });
        window.location.href = '/feed';
      } catch (err) {
        errorBox.textContent = err.message || 'Đăng nhập thất bại, vui lòng thử lại.';
        errorBox.style.display = 'block';
        if ((err.message || '').toLowerCase().includes('xác thực email')) {
          document.getElementById('resendVerificationBox').style.display = 'block';
        }
        submitBtn.disabled = false;
        submitBtn.textContent = 'Đăng nhập';
      }
    });
  </script>
</body>
</html>
