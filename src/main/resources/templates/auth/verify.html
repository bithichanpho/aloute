<!DOCTYPE html>
<html lang="vi" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
  
  <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico?v=20261027-bird-v1}">
  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/images/aloute-icon-32.png?v=20261027-bird-v1}">
  <link rel="apple-touch-icon" sizes="180x180" th:href="@{/images/aloute-icon-180.png?v=20261027-bird-v1}">
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <script th:src="@{/js/theme-init.js?v=20261019-global-theme-v1}"></script>
  <title>Xác thực email / ALOUTE</title>
  <link rel="stylesheet" th:href="@{/css/main.css?v=20261027-bird-privacy-v1}">
  <link rel="stylesheet" th:href="@{/vendor/bootstrap-icons/bootstrap-icons.min.css}">
  <link rel="stylesheet" th:href="@{/css/theme.css?v=20261027-bird-privacy-v1}">
  <link rel="stylesheet" th:href="@{/css/auth-form-feedback.css?v=20261025-focus-v1}">
  <link rel="stylesheet" th:href="@{/css/auth-otp.css?v=20261027-email-otp-6digit-v3}">
  <script th:src="@{/js/ui.js?v=20261019-global-theme-v1}" defer></script>
</head>
<body class="auth-body">
  <button type="button" class="auth-theme-toggle" data-theme-toggle aria-label="Chuyển giao diện sáng/tối" title="Chuyển giao diện sáng/tối">
    <i class="bi bi-moon-stars theme-icon theme-icon--to-dark" aria-hidden="true"></i>
    <i class="bi bi-sun theme-icon theme-icon--to-light" aria-hidden="true"></i>
  </button>

  <div class="auth-shell">
    <div class="auth-card auth-error-focus">
      <div class="auth-card__logo">
        <img th:src="@{/images/aloute-bird-logo.png?v=20261027-bird-v1}"
             src="/images/aloute-bird-logo.png" alt="ALOUTE" width="64" height="64">
      </div>
      <h1 class="auth-card__title">Xác thực email</h1>
      <p style="text-align:center;color:var(--text-secondary);font-size:14.5px;margin-top:-8px;margin-bottom:18px;">
        Nhập mã OTP gồm 6 chữ số đã được gửi tới email của bạn.
      </p>

      <div id="verifySuccess" class="form-success" style="display:none;">
        Xác thực email thành công! Bây giờ bạn có thể đăng nhập và sử dụng đầy đủ tính năng của ALOUTE.
      </div>
      <div id="verifyError" class="form-error" style="display:none;"></div>

      <form id="verifyForm" novalidate>
        <div class="field">
          <input type="email" id="email" name="email" placeholder="Email đã đăng ký" autocomplete="email" maxlength="254" th:value="${email}" required>
        </div>
        <div class="field">
          <input type="text" id="code" name="code" placeholder="Mã OTP 6 chữ số" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" style="letter-spacing:6px;text-align:center;font-size:20px;" required>
        </div>
        <button type="submit" class="btn-primary" id="submitBtn">Xác thực</button>
      </form>

      <div id="resendBox" style="margin-top:14px;text-align:center;">
        <button type="button" class="btn-outline" id="resendBtn">Gửi lại mã OTP</button>
        <div id="resendMessage" style="margin-top:10px;font-size:13.5px;"></div>
      </div>

      <p class="auth-switch">
        <a th:href="@{/register}">Đăng ký lại</a> · <a th:href="@{/login}">Đăng nhập</a>
      </p>
    </div>
  </div>

  <script th:src="@{/js/app.js?v=20261027-password-login-v1}"></script>
  <script th:src="@{/js/auth-form-feedback.js?v=20261027-email-otp-no-recovery-v1}"></script>
  <script th:src="@{/js/auth-otp.js?v=20261027-email-otp-6digit-v3}"></script>
  <script th:src="@{/js/auth-verify.js?v=20261027-email-otp-6digit-v3}"></script>
</body>
</html>
