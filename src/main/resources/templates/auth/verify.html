<!DOCTYPE html>
<html lang="vi" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('aloute-theme');
        if (theme !== 'light' && theme !== 'dark') theme = 'dark';
        document.documentElement.setAttribute('data-bs-theme', theme);
      } catch (e) { /* Dùng theme tối mặc định nếu localStorage không khả dụng */ }
    })();
  </script>
  <title>Xác thực email / ALOUTE</title>
  <link rel="stylesheet" th:href="@{/css/main.css?v=20261017-moderation-toast-v2}">
  <link rel="stylesheet" th:href="@{/vendor/bootstrap-icons/bootstrap-icons.min.css}">
  <link rel="stylesheet" th:href="@{/css/theme.css?v=20261017-moderation-toast-v2}">
  <script th:src="@{/js/ui.js?v=20261017-moderation-toast-v2}" defer></script>
</head>
<body class="auth-body">
  <button type="button" class="auth-theme-toggle" data-theme-toggle aria-label="Chuyển giao diện sáng/tối" title="Chuyển giao diện sáng/tối">
    <i class="bi bi-moon-stars theme-icon theme-icon--to-dark" aria-hidden="true"></i>
    <i class="bi bi-sun theme-icon theme-icon--to-light" aria-hidden="true"></i>
  </button>

  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-card__logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3c-4.5 0-7.5 2.9-7.5 7.2 0 3.6 2.2 5.8 4 6.8-.2 1.1-.7 2.4-1.6 3.3 2.3.2 4.3-.6 5.6-1.9 3.7-.3 6.5-3 6.5-6.9C19 6.4 15.9 3 12 3Z"/>
        </svg>
      </div>
      <h1 class="auth-card__title">Xác thực email</h1>

      <div id="verifyPending" style="text-align:center;color:var(--text-secondary);font-size:14.5px;">
        Đang xác thực email của bạn...
      </div>
      <div id="verifySuccess" class="form-success" style="display:none;">
        Xác thực email thành công! Bây giờ bạn có thể sử dụng đầy đủ tính năng của ALOUTE.
      </div>
      <div id="verifyError" class="form-error" style="display:none;"></div>

      <div id="resendBox" style="display:none;margin-top:14px;">
        <div class="field">
          <input type="text" id="resendIdentifier" placeholder="Email hoặc tên đăng nhập">
        </div>
        <button type="button" class="btn-outline" id="resendBtn">
          Gửi lại email xác thực
        </button>
        <div id="resendMessage" style="margin-top:10px;font-size:13.5px;"></div>
      </div>

      <p class="auth-switch">
        <a th:href="@{/feed}">Về trang chủ</a> · <a th:href="@{/login}">Đăng nhập</a>
      </p>
    </div>
  </div>

  <script th:src="@{/js/app.js?v=20261017-moderation-toast-v2}"></script>
  <script th:inline="javascript">
    const token = new URLSearchParams(window.location.search).get('token')?.trim() || '';
    const pendingBox = document.getElementById('verifyPending');
    const successBox = document.getElementById('verifySuccess');
    const errorBox = document.getElementById('verifyError');
    const resendBox = document.getElementById('resendBox');

    document.getElementById('resendBtn').addEventListener('click', async function () {
      const identifier = document.getElementById('resendIdentifier').value.trim();
      const message = document.getElementById('resendMessage');
      if (!identifier) {
        message.textContent = 'Vui lòng nhập email hoặc tên đăng nhập.';
        return;
      }
      this.disabled = true;
      try {
        const result = await Aloute.api('/api/auth/resend-verification', {
          method: 'POST',
          body: JSON.stringify({ identifier })
        });
        message.textContent = result?.message || 'Nếu tài khoản hợp lệ, email mới đã được gửi.';
      } catch (err) {
        message.textContent = err.message || 'Không thể gửi lại email.';
      } finally {
        this.disabled = false;
      }
    });

    (async function () {
      if (!token) {
        pendingBox.style.display = 'none';
        errorBox.textContent = 'Thiếu mã xác thực trong đường dẫn.';
        errorBox.style.display = 'block';
        resendBox.style.display = 'block';
        return;
      }
      try {
        await Aloute.api('/api/auth/verify-email', { method: 'POST', body: JSON.stringify({ token }) });
        pendingBox.style.display = 'none';
        successBox.style.display = 'block';
      } catch (err) {
        pendingBox.style.display = 'none';
        const detail = err.message || '';
        errorBox.textContent = detail.includes('không hợp lệ') || detail.includes('đã được dùng')
          ? 'Link này không còn hiệu lực. Nếu bạn đã yêu cầu gửi lại, hãy mở email xác thực mới nhất.'
          : detail || 'Xác thực thất bại. Vui lòng yêu cầu gửi lại email xác thực.';
        errorBox.style.display = 'block';
        resendBox.style.display = 'block';
      }
    })();
  </script>
</body>
</html>
