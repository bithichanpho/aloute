
<!DOCTYPE html>
<html lang="vi" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <script th:src="@{/js/theme-init.js?v=20261019-global-theme-v1}"></script>
  <title>Xác thực mã đặt lại mật khẩu / ALOUTE</title>
  <link rel="stylesheet" th:href="@{/css/main.css?v=20261017-moderation-toast-v2}">
  <link rel="stylesheet" th:href="@{/vendor/bootstrap-icons/bootstrap-icons.min.css}">
  <link rel="stylesheet" th:href="@{/css/theme.css?v=20261017-moderation-toast-v2}">
  <link rel="stylesheet" th:href="@{/css/auth-form-feedback.css?v=20261025-focus-v1}">
  <link rel="stylesheet" th:href="@{/css/auth-otp.css?v=20261025-otp-message-v2}">
  <script th:src="@{/js/ui.js?v=20261019-global-theme-v1}" defer></script>
</head>
<body class="auth-body">
  <button type="button" class="auth-theme-toggle" data-theme-toggle aria-label="Chuyển giao diện sáng/tối" title="Chuyển giao diện sáng/tối">
    <i class="bi bi-moon-stars theme-icon theme-icon--to-dark" aria-hidden="true"></i>
    <i class="bi bi-sun theme-icon theme-icon--to-light" aria-hidden="true"></i>
  </button>

  <div class="auth-shell">
    <div class="auth-card auth-error-focus">
      <div class="auth-card__logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3c-4.5 0-7.5 2.9-7.5 7.2 0 3.6 2.2 5.8 4 6.8-.2 1.1-.7 2.4-1.6 3.3 2.3.2 4.3-.6 5.6-1.9 3.7-.3 6.5-3 6.5-6.9C19 6.4 15.9 3 12 3Z"/>
        </svg>
      </div>
      <h1 class="auth-card__title">Xác thực mã OTP</h1>
      <p style="text-align:center;color:var(--text-secondary);font-size:14.5px;margin-top:-8px;margin-bottom:18px;">
        Nhập mã OTP đã gửi tới email. Mã đúng sẽ mở bước đặt mật khẩu mới.
      </p>

      <div id="formError" class="form-error" style="display:none;"></div>
      <div id="formSuccess" class="form-success" style="display:none;"></div>

      <form id="resetCodeForm" novalidate>
        <div class="field">
          <input type="email" id="email" name="email" placeholder="Email đã đăng ký" autocomplete="email" maxlength="254" th:value="${email}" required>
        </div>
        <div class="field">
          <input type="text" id="code" name="code" placeholder="Mã OTP 6 chữ số" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" style="letter-spacing:6px;text-align:center;font-size:20px;" required>
        </div>
        <button type="submit" class="btn-primary" id="submitBtn">Xác thực mã OTP</button>
      </form>

      <p class="auth-switch">
        Chưa nhận được mã? <a th:href="@{/forgot-password}">Gửi lại mã OTP</a> · <a th:href="@{/login}">Đăng nhập</a>
      </p>
    </div>
  </div>

  <script th:src="@{/js/app.js?v=20261017-moderation-toast-v2}"></script>
  <script th:src="@{/js/auth-form-feedback.js?v=20261025-otp-message-v2}"></script>
  <script th:src="@{/js/auth-otp.js?v=20261025-input-retry-v3}"></script>
  <script th:src="@{/js/auth-verify-reset-code.js?v=20261025-otp-message-v2}"></script>
</body>
</html>
