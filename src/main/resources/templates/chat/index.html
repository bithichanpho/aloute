<!DOCTYPE html>
<html th:replace="~{layout/base :: layout(~{::title}, ~{::section})}" xmlns:th="http://www.thymeleaf.org">
<head><title>Tin nhắn — ALOUTE</title></head>
<body>
<section class="content-inner--wide" style="margin: 0 auto;">

  <div class="chat-shell" id="chatShell">

    <!-- Cột trái: danh sách hội thoại -->
    <aside class="chat-list" id="chatList">
      <div class="chat-list__header">Tin nhắn</div>

      <div th:if="${#lists.isEmpty(conversations)}" class="empty-state">
        Bạn chưa có cuộc trò chuyện nào. Hãy vào trang <a th:href="@{/search}" style="color:inherit;text-decoration:underline;">Tìm kiếm</a> để bắt đầu nhắn tin với ai đó!
      </div>

      <div class="chat-item" th:each="conv : ${conversations}"
           th:attr="data-user-id=${conv.otherUserId},data-username=${conv.otherUsername},data-avatar=${conv.otherAvatarUrl}">
        <img class="chat-item__avatar"
             th:src="${conv.otherAvatarUrl != null ? conv.otherAvatarUrl : 'https://i.pravatar.cc/150?img=32'}"
             src="https://i.pravatar.cc/150?img=32" alt="avatar">
        <div style="flex:1;min-width:0;">
          <div class="chat-item__name" th:text="${conv.otherFullName ?: conv.otherUsername}">Người dùng</div>
          <div class="chat-item__preview" th:text="${conv.lastMessage}">...</div>
        </div>
        <span class="chat-item__unread" th:if="${conv.unreadCount > 0}" th:text="${conv.unreadCount > 99 ? '99+' : conv.unreadCount}">1</span>
      </div>
    </aside>

    <!-- Cột phải: khung tin nhắn của hội thoại đang chọn -->
    <div class="chat-thread" id="chatThread">
      <div class="empty-state" id="chatEmptyState" style="margin: auto;">
        Chọn một cuộc trò chuyện ở bên trái để bắt đầu nhắn tin.
      </div>

      <template id="chatThreadTemplate">
        <div class="chat-thread__header">
          <button class="chat-thread__back" id="chatBackBtn" aria-label="Quay lại" style="display:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <img id="chatThreadAvatar" src="https://i.pravatar.cc/150?img=32" alt="avatar">
          <span id="chatThreadName">...</span>
        </div>

        <div class="chat-thread__messages" id="messageList"></div>

        <div class="chat-thread__input">
          <input type="text" id="messageInput" maxlength="1000" placeholder="Nhắn tin...">
          <button class="chat-thread__send" id="sendMessageBtn" aria-label="Gửi">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
          </button>
        </div>
      </template>
    </div>

  </div>

</section>

<script th:src="@{/js/chat.js}"></script>
</body>
</html>
