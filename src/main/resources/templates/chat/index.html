<!DOCTYPE html>
<html th:replace="~{layout/base :: layout(~{::title}, ~{::section})}" xmlns:th="http://www.thymeleaf.org">
<head><title>Tin nhắn — ALOUTE</title></head>
<body>
<section class="content-inner--chat" id="chatPage">

  <div class="chat-shell" id="chatShell">

    <!-- Cột trái: tìm kiếm + danh sách hội thoại / bạn bè -->
    <aside class="chat-list" id="chatList">
      <div class="chat-list__header">
        <span>Tin nhắn</span>
      </div>

      <label class="chat-search" for="chatSearchInput">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="text" id="chatSearchInput" placeholder="Tìm kiếm" autocomplete="off">
      </label>

      <div class="chat-list__scroll" id="chatListScroll">

        <div th:if="${#lists.isEmpty(conversations)}" class="empty-state empty-state--chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
          <p>Chưa có ai để nhắn tin</p>
          <span>Theo dõi lẫn nhau với một người để trở thành bạn bè và bắt đầu trò chuyện. Ghé qua trang <a th:href="@{/search}">Tìm kiếm</a> nhé!</span>
        </div>

        <div class="chat-item"
             th:each="conv : ${conversations}"
             th:classappend="${!conv.hasConversation} ? 'chat-item--preview' : ''"
             th:attr="data-user-id=${conv.otherUserId},
                      data-username=${conv.otherUsername},
                      data-fullname=${conv.otherFullName ?: conv.otherUsername},
                      data-avatar=${conv.otherAvatarUrl},
                      data-online=${conv.online},
                      data-has-conversation=${conv.hasConversation}">
          <span class="chat-item__avatar-wrap">
            <img class="chat-item__avatar"
                 th:src="${conv.otherAvatarUrl != null ? conv.otherAvatarUrl : 'https://i.pravatar.cc/150?img=32'}"
                 src="https://i.pravatar.cc/150?img=32" alt="avatar">
            <span class="presence-dot" th:if="${conv.online}"></span>
          </span>
          <div class="chat-item__body">
            <div class="chat-item__top">
              <span class="chat-item__name" th:text="${conv.otherFullName ?: conv.otherUsername}">Người dùng</span>
              <span class="chat-item__time" th:if="${conv.hasConversation}" th:text="${conv.lastMessageTimeAgo}">1 giờ</span>
            </div>
            <div class="chat-item__bottom">
              <span class="chat-item__preview" th:if="${conv.hasConversation}" th:text="${conv.lastMessage}">...</span>
              <span class="chat-item__preview chat-item__preview--new" th:unless="${conv.hasConversation}">Bạn bè mới · Bắt đầu trò chuyện</span>
              <span class="chat-item__unread" th:if="${conv.hasConversation and conv.unreadCount > 0}" th:text="${conv.unreadCount > 99 ? '99+' : conv.unreadCount}">1</span>
            </div>
          </div>
        </div>

      </div>
    </aside>

    <!-- Cột phải: khung tin nhắn của hội thoại đang chọn -->
    <div class="chat-thread" id="chatThread">
      <div class="empty-state empty-state--thread" id="chatEmptyState">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
        <p>Tin nhắn của bạn</p>
        <span>Chọn một cuộc trò chuyện ở bên trái để bắt đầu nhắn tin.</span>
      </div>

      <template id="chatThreadTemplate">
        <div class="chat-thread__header">
          <button class="chat-thread__back" id="chatBackBtn" aria-label="Quay lại">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <span class="chat-thread__avatar-wrap">
            <img id="chatThreadAvatar" src="https://i.pravatar.cc/150?img=32" alt="avatar">
            <span class="presence-dot" id="chatThreadPresenceDot" hidden></span>
          </span>
          <div class="chat-thread__identity">
            <span id="chatThreadName">...</span>
            <span class="chat-thread__status" id="chatThreadStatus"></span>
          </div>
        </div>

        <div class="chat-thread__messages" id="messageList"></div>

        <div class="chat-thread__input">
          <input type="text" id="messageInput" maxlength="1000" placeholder="Nhắn tin..." autocomplete="off">
          <button class="chat-thread__send" id="sendMessageBtn" aria-label="Gửi" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
          </button>
        </div>
      </template>
    </div>

  </div>

  <script th:src="@{/js/chat.js}" defer></script>

</section>

</body>
</html>
