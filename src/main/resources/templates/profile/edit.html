<!DOCTYPE html>

<html th:replace="~{layout/base :: layout(~{::title}, ~{::section})}" xmlns:th="http://www.thymeleaf.org">
<head><title>Chỉnh sửa trang cá nhân — ALOUTE</title></head>
<body>
<section class="content-inner">

  <div class="page-header">
    <h1>Chỉnh sửa trang cá nhân</h1>
  </div>

  <div class="feed-panel" style="padding: 24px 22px;">

    <div style="display:flex; align-items:center; gap:16px; margin-bottom:20px;">
      <img th:src="${profileUser.avatarUrl != null ? profileUser.avatarUrl : '/images/avatar_default.png'}"
           src="/images/avatar_default.png" alt="avatar"
           style="width:72px; height:72px; border-radius:50%; object-fit:cover;">
      <div>
        <label class="btn-outline" style="display:inline-block; width:auto; padding:8px 16px; cursor:pointer;">
          Đổi ảnh đại diện
          <input type="file" id="editAvatarInput" accept="image/*" style="display:none;">
        </label>
      </div>
    </div>

    <form id="profileEditForm">
      <div class="field">
        <input type="text" id="editFullName" placeholder="Họ và tên" th:value="${profileUser.fullName}" maxlength="100" required>
      </div>

      <div class="field">
        <input type="text" disabled th:value="'@' + ${profileUser.username}"
               style="opacity:0.6; cursor:not-allowed;">
        <p class="field-hint">Không thể đổi tên đăng nhập</p>
      </div>

      <div class="field">
        <textarea id="editBio" placeholder="Giới thiệu bản thân" rows="3" maxlength="300"
                  style="width:100%; padding:13px 14px; border:1px solid var(--border-strong); border-radius:10px;
                         font-family:var(--font); font-size:14.5px; background:var(--bg-panel); color:var(--text-primary);
                         resize:vertical; outline:none;" th:text="${profileUser.bio}"></textarea>
      </div>

      <div class="field field--switch">
        <label class="switch-row" for="editPrivateAccount">
          <span class="switch-row__text">
            <strong>Tài khoản riêng tư</strong>
            <small>Khi bật, người theo dõi mới cần bạn duyệt trước khi xem bài viết; chỉ bạn bè theo dõi lẫn nhau được nhắn tin. Người đã theo dõi vẫn được giữ quyền truy cập.</small>
          </span>
          <input type="checkbox" id="editPrivateAccount" th:checked="${profileUser.privateAccount}">
          <span class="switch-row__track" aria-hidden="true"><span class="switch-row__thumb"></span></span>
        </label>
      </div>

      <button type="submit" class="btn-primary" style="margin-top:8px;">Lưu thay đổi</button>
    </form>
  </div>

  <div class="feed-panel" style="padding: 24px 22px; margin-top:16px;">
    <h2 style="font-size:16px;margin:0 0 16px;">Đổi mật khẩu</h2>

    <div id="changePasswordError" class="form-error" style="display:none;"></div>
    <div id="changePasswordSuccess" class="form-success" style="display:none;"></div>

    <form id="changePasswordForm">
      <div class="field">
        <input type="password" id="currentPassword" placeholder="Mật khẩu hiện tại" autocomplete="current-password" required>
      </div>
      <div class="field">
        <input type="password" id="newPassword" placeholder="8–72 ký tự, có hoa, thường, số và ký tự đặc biệt" autocomplete="new-password" minlength="8" maxlength="72" required>
      </div>
      <div class="field">
        <input type="password" id="confirmNewPassword" placeholder="Xác nhận mật khẩu mới" autocomplete="new-password" minlength="8" maxlength="72" required>
      </div>
      <button type="submit" class="btn-outline" style="width:auto; padding:10px 20px;">Đổi mật khẩu</button>
    </form>
  </div>

</section>
</body>
</html>
