<!DOCTYPE html>
<html th:replace="~{layout/base :: layout(~{::title}, ~{::section})}" xmlns:th="http://www.thymeleaf.org">
<head><title th:text="${profileUser != null ? profileUser.fullName + ' — ALOUTE' : 'Hồ sơ — ALOUTE'}">Hồ sơ — ALOUTE</title></head>
<body>
<section class="content-inner content-inner--profile">

  <div class="profile-cover" th:if="${profileUser != null}">

    <!-- Hàng đầu kiểu Threads: tên + @handle bên trái, ảnh đại diện bên phải -->
    <div class="profile-cover__main">
      <div class="profile-cover__identity">
        <h1 class="profile-cover__name" th:text="${profileUser.fullName}">Họ tên</h1>
        <p class="profile-cover__handle">
          <span th:text="'@' + ${profileUser.username}">@username</span>
          <span class="profile-cover__badge" th:if="${profileUser.privateAccount}" title="Tài khoản riêng tư">Riêng tư</span>
        </p>
      </div>

      <div class="profile-cover__avatar-wrap">
        <img class="profile-cover__avatar" th:src="${profileUser.avatarUrl}"
             src="/images/avatar_default.png" alt="Ảnh đại diện" decoding="async">
      </div>
    </div>

    <div class="profile-cover__bio" th:if="${profileUser.bio != null and !#strings.isEmpty(profileUser.bio)}">
      <p class="profile-cover__text" th:text="${profileUser.bio}">Tiểu sử</p>
    </div>

    <!-- Hàng số liệu: luôn nằm ngang hàng, bấm vào từng con số để mở danh sách người tương ứng -->
    <div class="profile-stats profile-stats--row" th:attr="data-profile-user-id=${profileUser.id}">
      <span class="profile-stat profile-stat--static">
        <strong th:text="${postCount}">0</strong>
        <span>bài viết</span>
      </span>
      <button type="button" class="profile-stat" data-people-tab="followers">
        <strong th:text="${profileUser.followerCount}">0</strong>
        <span>người theo dõi</span>
      </button>
      <button type="button" class="profile-stat" data-people-tab="following">
        <strong th:text="${profileUser.followingCount}">0</strong>
        <span>đang theo dõi</span>
      </button>
      <button type="button" class="profile-stat" data-people-tab="close">
        <strong th:text="${profileUser.closeFriendCount}">0</strong>
        <span>bạn thân</span>
      </button>
    </div>

    <!-- Nút hành động: kéo dài hết bề ngang, chia đều như Threads -->
    <div class="profile-cover__actions" th:if="${isOwnProfile}">
      <button type="button" class="btn-profile" onclick="location.href='/profile/edit'">Chỉnh sửa trang cá nhân</button>
      <button type="button" class="btn-profile" onclick="location.href='/saved'">Đã lưu</button>
    </div>

    <div class="profile-cover__actions" th:unless="${isOwnProfile}">
      <button class="btn-profile btn-profile--primary btn-follow"
              th:classappend="${profileUser.followedByCurrentUser} ? ' is-following' : ''"
              th:attr="data-user-id=${profileUser.id}"
              th:text="${profileUser.followedByCurrentUser} ? 'Đang theo dõi' : 'Theo dõi'">Theo dõi</button>

      <!-- Nhắn tin: mở cho mọi người, trừ khi chủ tài khoản bật chế độ riêng tư -->
      <button class="btn-profile"
              th:classappend="${!profileUser.canMessage} ? ' is-disabled' : ''"
              th:disabled="${!profileUser.canMessage}"
              th:attr="title=${profileUser.canMessage} ? null : 'Tài khoản này ở chế độ riêng tư — cần theo dõi lẫn nhau để nhắn tin'"
              th:onclick="|location.href='/chat?userId=' + ${profileUser.id}|">Nhắn tin</button>
    </div>

    <div class="profile-cover__actions profile-cover__actions--secondary"
         th:if="${!isOwnProfile and profileUser.mutualFriend and profileUser.closeFriendStatus != 'PENDING_RECEIVED'}">
      <button class="btn-profile btn-close-friend"
              th:with="cfAccepted=${profileUser.closeFriendStatus == 'ACCEPTED'}, cfPending=${profileUser.closeFriendStatus == 'PENDING_SENT'}"
              th:classappend="${cfAccepted ? ' is-close' : (cfPending ? ' is-pending' : '')}"
              th:attr="data-user-id=${profileUser.id}, data-status=${profileUser.closeFriendStatus}"
              th:text="${cfAccepted ? '★ Bạn thân' : (cfPending ? 'Đã gửi lời mời' : '+ Bạn thân')}">+ Bạn thân</button>
    </div>

    <!-- Họ vừa gửi lời mời kết bạn thân cho mình -> cho chấp nhận/từ chối ngay tại đây -->
    <div th:if="${!isOwnProfile and profileUser.closeFriendStatus == 'PENDING_RECEIVED'}"
         class="close-friend-request-bar" th:attr="data-user-id=${profileUser.id}">
      <span th:text="${profileUser.fullName + ' đã gửi lời mời kết bạn thân'}">đã gửi lời mời kết bạn thân</span>
      <div class="close-friend-request-bar__actions">
        <button type="button" class="close-friend-request-bar__accept">Chấp nhận</button>
        <button type="button" class="close-friend-request-bar__decline">Từ chối</button>
      </div>
    </div>

    <!-- Mặc định mở ở Dòng thời gian (kiểu threads); Lưới chỉ gom bài có ảnh -->
    <div class="profile-views">
      <button type="button" class="profile-view is-active" data-profile-view="list">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
        <span>Dòng thời gian</span>
      </button>
      <button type="button" class="profile-view" data-profile-view="grid">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        <span>Lưới</span>
      </button>
    </div>
  </div>

  <div th:if="${profileUser == null}" class="empty-state">Không tìm thấy người dùng này.</div>

  <!-- ========== Dòng thời gian (mặc định) ========== -->
  <div class="profile-posts" id="profilePosts" th:if="${profileUser != null}">

    <div th:if="${#lists.isEmpty(userPosts)}" class="empty-state">
      <span th:if="${isOwnProfile}">Bạn chưa có bài viết nào. <a th:href="@{/compose}" style="color:inherit;text-decoration:underline;">Đăng bài đầu tiên</a> nhé!</span>
      <span th:unless="${isOwnProfile}">Người dùng này chưa có bài viết nào.</span>
    </div>

    <div class="post" th:each="post : ${userPosts}" th:attr="data-post-id=${post.id}">
      <div class="post__avatar-col">
        <img class="post__avatar"
             th:src="${post.userAvatarUrl != null ? post.userAvatarUrl : '/images/avatar_default.png'}"
             src="/images/avatar_default.png" alt="avatar" loading="lazy" decoding="async">
      </div>
      <div class="post__body">
        <div class="post__header">
          <span class="post__username" th:text="${post.username}">username</span>
          <span class="post__time" th:text="${post.timeAgo}">6 giờ</span>
          <button class="post__more post__delete" th:if="${isOwnProfile}" aria-label="Xóa bài viết">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
          </button>
        </div>
        <p class="post__content" th:text="${post.content}">Nội dung bài viết</p>
        <img class="post__image" th:if="${post.imageUrl != null}" th:src="${post.imageUrl}"
             alt="ảnh bài viết" loading="lazy" decoding="async">
        <div class="post__actions">
          <button th:classappend="${post.likedByCurrentUser} ? ' is-liked'" class="action action--like">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.2s-7.2-4.4-9-9C1.7 7.6 3.2 5 6 4.6c1.9-.3 3.4.6 4.3 1.9.6-.9 1.5-1.6 2.5-1.9 2.9-.6 4.9 2 4.5 4.6-.7 4.7-9.3 10.5-9.3 10.5Z"/></svg>
            <span th:attr="data-raw=${post.likeCount}" th:text="${post.likeCount}">0</span>
          </button>
          <button class="action action--reply" th:attr="data-post-id=${post.id}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-8.6 8.4c-1.3 0-2.6-.3-3.7-.9L3 20l1.1-5.4a8.3 8.3 0 0 1-.7-3.1A8.4 8.4 0 0 1 12.1 3a8.4 8.4 0 0 1 8.9 8.5Z"/></svg>
            <span th:attr="data-raw=${post.commentCount}" th:text="${post.commentCount}">0</span>
          </button>
        </div>
      </div>
    </div>

    <button type="button" class="btn-outline" data-load-posts
            th:if="${#lists.size(userPosts) == 20}"
            th:attr="data-url=@{'/api/posts/user/' + ${profileUser.id} + '/fragment'}">Tải thêm</button>
  </div>

  <!-- ========== Lưới: CHỈ bài có ảnh ========== -->
  <div class="profile-grid-wrap" id="profileGridWrap" th:if="${profileUser != null}" hidden>
    <div th:if="${#lists.isEmpty(mediaPosts)}" class="empty-state">
      Chưa có bài viết nào kèm hình ảnh.
    </div>
    <div class="profile-grid" id="profileGrid" th:if="${not #lists.isEmpty(mediaPosts)}">
      <button type="button" class="grid-tile" th:each="post : ${mediaPosts}"
              th:attr="data-goto-post=${post.id}">
        <img class="grid-tile__image" th:src="${post.imageUrl}" alt="" loading="lazy" decoding="async">
        <span class="grid-tile__overlay">
          <span class="grid-tile__stat">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.2s-7.2-4.4-9-9C1.7 7.6 3.2 5 6 4.6c1.9-.3 3.4.6 4.3 1.9.6-.9 1.5-1.6 2.5-1.9 2.9-.6 4.9 2 4.5 4.6-.7 4.7-9.3 10.5-9.3 10.5Z"/></svg>
            <span th:text="${post.likeCount}">0</span>
          </span>
          <span class="grid-tile__stat">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 11.5a8.4 8.4 0 0 1-8.6 8.4c-1.3 0-2.6-.3-3.7-.9L3 20l1.1-5.4a8.3 8.3 0 0 1-.7-3.1A8.4 8.4 0 0 1 12.1 3a8.4 8.4 0 0 1 8.9 8.5Z"/></svg>
            <span th:text="${post.commentCount}">0</span>
          </span>
        </span>
      </button>
    </div>
  </div>

  <!-- Hộp thoại danh sách kết nối: người theo dõi / đang theo dõi / bạn thân -->
  <div class="people-modal" id="peopleModal" th:if="${profileUser != null}" hidden>
    <div class="people-modal__backdrop" data-people-close></div>
    <div class="people-modal__panel" role="dialog" aria-modal="true" aria-labelledby="peopleModalTitle">
      <div class="people-modal__head">
        <h2 class="people-modal__title" id="peopleModalTitle" th:text="${profileUser.fullName}">Kết nối</h2>
        <button type="button" class="people-modal__close" data-people-close aria-label="Đóng">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="people-modal__tabs">
        <button type="button" class="people-tab" data-tab="followers">
          Người theo dõi <span th:text="${profileUser.followerCount}">0</span>
        </button>
        <button type="button" class="people-tab" data-tab="following">
          Đang theo dõi <span th:text="${profileUser.followingCount}">0</span>
        </button>
        <button type="button" class="people-tab" data-tab="close">
          Bạn thân <span th:text="${profileUser.closeFriendCount}">0</span>
        </button>
      </div>
      <div class="people-modal__body" id="peopleModalBody"></div>
    </div>
  </div>
</section>
</body>
</html>
