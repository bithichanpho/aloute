<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:replace="${title}">ALOUTE</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">

  <!-- CSS cua chinh minh tai truoc va la thu duy nhat chan render -->
  <link rel="stylesheet" th:href="@{/css/main.css?v=20260920-clean-v17}">

  <!-- Font tai khong chan render: trinh duyet ve trang bang font he thong truoc,
       doi font Inter ve thi doi lai. Bo di ~200-400ms trang trang tren mang cham. -->
  <link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <noscript>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  </noscript>
</head>
<body th:classappend="${activeNav == 'chat'} ? 'page-chat' : (${activeNav == 'feed'} ? 'page-feed' : '')" th:attr="data-current-user-id=${currentUser != null ? currentUser.id : ''}">

<div id="toastHost"></div>

<div class="app-shell">

  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <div class="main-column" th:classappend="${activeNav == 'feed'} ? 'main-column--feed' : ''">
    <div class="content-inner" th:replace="${content}"></div>
  </div>

  <button class="fab" th:if="${activeNav != 'chat'}" aria-label="Tạo bài viết mới" onclick="location.href='/compose'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</div>

<!-- SockJS/Stomp KHONG con nhung o day: app.js tu tai chung bat dong bo,
     va chi khi nguoi dung da dang nhap (xem ensureRealtimeLibs trong app.js). -->
<script th:src="@{/js/app.js}"></script>
</body>
</html>
