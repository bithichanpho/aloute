<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:replace="${title}">ALOUTE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<div class="app-shell">

  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <div class="main-column">
    <div class="content-inner" th:replace="${content}"></div>
  </div>

  <button class="fab" aria-label="Tạo bài viết mới" onclick="location.href='/compose'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
