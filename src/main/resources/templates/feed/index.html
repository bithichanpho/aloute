<!DOCTYPE html>
<html th:replace="~{layout/base :: layout(~{::title}, ~{::section})}" xmlns:th="http://www.thymeleaf.org">
<head><title>Dành cho bạn — ALOUTE</title></head>
<body>
<section>

  <div class="page-header">
    <h1 th:text="${activeTab == 'following'} ? 'Following' : 'Dành cho bạn'">Dành cho bạn</h1>
  </div>

  <div class="feed-panel">

    <div class="compose">
      <img class="compose__avatar"
           th:src="${currentUser != null and currentUser.avatarUrl != null ? currentUser.avatarUrl : 'https://i.pravatar.cc/150?img=8'}"
           src="https://i.pravatar.cc/150?img=8" alt="avatar của tôi">
      <div class="compose__body">
        <input class="compose__placeholder" type="text" placeholder="Có gì mới?">
      </div>
      <button class="btn-post" disabled>Đăng</button>
    </div>

    <div th:if="${#lists.isEmpty(posts)}" class="empty-state">
      <span th:if="${activeTab == 'following'}">Bạn chưa follow ai, hoặc họ chưa đăng bài nào. Hãy thử tìm kiếm thêm bạn bè!</span>
      <span th:unless="${activeTab == 'following'}">Chưa có bài viết nào. Hãy là người đầu tiên chia sẻ!</span>
    </div>

    <div class="post" th:each="post : ${posts}" th:attr="data-post-id=${post.id}">
      <div class="post__avatar-col">
        <a th:href="@{'/profile/' + ${post.userId}}">
          <img class="post__avatar"
               th:src="${post.userAvatarUrl != null ? post.userAvatarUrl : 'https://i.pravatar.cc/150?img=12'}"
               src="https://i.pravatar.cc/150?img=12" alt="avatar">
        </a>
      </div>
      <div class="post__body">
        <div class="post__header">
          <a th:href="@{'/profile/' + ${post.userId}}" class="post__username" th:text="${post.username}">username</a>
          <span class="post__time" th:text="${#temporals.format(post.createdAt, 'HH:mm dd/MM/yyyy')}">6 giờ</span>
          <button class="post__more post__delete" th:if="${currentUser != null and currentUser.id == post.userId}" aria-label="Xóa bài viết">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
          </button>
        </div>
        <p class="post__content" th:text="${post.content}">Nội dung bài viết</p>
        <img class="post__image" th:if="${post.imageUrl != null}" th:src="${post.imageUrl}" alt="ảnh bài viết">
        <div class="post__actions">
          <button th:classappend="${post.likedByCurrentUser} ? ' is-liked'" class="action action--like">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.2s-7.2-4.4-9-9C1.7 7.6 3.2 5 6 4.6c1.9-.3 3.4.6 4.3 1.9.6-.9 1.5-1.6 2.5-1.9 2.9-.6 4.9 2 4.5 4.6-.7 4.7-9.3 10.5-9.3 10.5Z"/></svg>
            <span th:attr="data-raw=${post.likeCount}" th:text="${post.likeCount}">0</span>
          </button>
          <button class="action action--reply">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-8.6 8.4c-1.3 0-2.6-.3-3.7-.9L3 20l1.1-5.4a8.3 8.3 0 0 1-.7-3.1A8.4 8.4 0 0 1 12.1 3a8.4 8.4 0 0 1 8.9 8.5Z"/></svg>
            <span th:text="${post.commentCount}">0</span>
          </button>
        </div>
      </div>
    </div>

  </div>
</section>
</body>
</html>
