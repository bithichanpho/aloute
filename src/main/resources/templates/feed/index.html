<!DOCTYPE html>
<html th:replace="~{layout/base :: layout(~{::title}, ~{::section})}" xmlns:th="http://www.thymeleaf.org">
<head><title>Dành cho bạn — ALOUTE</title></head>
<body>
<section>

  <div class="page-header">
    <h1>Dành cho bạn</h1>
    <button aria-label="Tùy chọn khác">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
    </button>
  </div>

  <div class="feed-panel">

    <div class="compose">
      <img class="compose__avatar" src="https://i.pravatar.cc/150?img=8" alt="avatar của tôi">
      <div class="compose__body">
        <input class="compose__placeholder" type="text" placeholder="Có gì mới?">
      </div>
      <button class="btn-post" disabled>Đăng</button>
    </div>

    <div class="trending">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
      Thịnh hành: <mark>ALOUTE Team</mark>
    </div>

    <div class="post">
      <div class="post__avatar-col">
        <img class="post__avatar" src="https://i.pravatar.cc/150?img=12" alt="avatar">
        <div class="post__avatar-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        </div>
      </div>
      <div class="post__body">
        <div class="post__header">
          <span class="post__username">minh_tran</span>
          <span class="post__time">6 giờ</span>
          <button class="post__more" aria-label="Thêm tùy chọn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
          </button>
        </div>
        <p class="post__content">Vừa deploy xong tính năng chat real-time cho ALOUTE, WebSocket chạy mượt hơn mình tưởng nhiều 🚀 Cảm ơn cả nhóm đã cố gắng hết mình trong 3 tuần vừa qua!</p>
        <div class="post__actions">
          <button class="action action--like" onclick="toggleLike(this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.2s-7.2-4.4-9-9C1.7 7.6 3.2 5 6 4.6c1.9-.3 3.4.6 4.3 1.9.6-.9 1.5-1.6 2.5-1.9 2.9-.6 4.9 2 4.5 4.6-.7 4.7-9.3 10.5-9.3 10.5Z"/></svg>
            <span>4,6K</span>
          </button>
          <button class="action action--reply">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-8.6 8.4c-1.3 0-2.6-.3-3.7-.9L3 20l1.1-5.4a8.3 8.3 0 0 1-.7-3.1A8.4 8.4 0 0 1 12.1 3a8.4 8.4 0 0 1 8.9 8.5Z"/></svg>
            <span>16</span>
          </button>
          <button class="action action--repost">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
            <span>74</span>
          </button>
          <button class="action action--share">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
            <span>20</span>
          </button>
        </div>
      </div>
      <button class="post__save" aria-label="Lưu bài viết">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12v17l-6-4-6 4V4Z"/></svg>
      </button>
    </div>

    <div class="thread-divider">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 14.5 8.5 21 9.3 16 13.8 17.5 20.5 12 17 6.5 20.5 8 13.8 3 9.3 9.5 8.5 12 2Z"/></svg>
      First thread
    </div>

    <div class="post">
      <div class="post__avatar-col">
        <img class="post__avatar" src="https://i.pravatar.cc/150?img=32" alt="avatar">
        <div class="post__avatar-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        </div>
      </div>
      <div class="post__body">
        <div class="post__header">
          <span class="post__username">lan_pham</span>
          <span class="post__time">22 giờ</span>
          <button class="post__more" aria-label="Thêm tùy chọn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
          </button>
        </div>
        <p class="post__content">Góc làm việc mới của mình nè, mọi người thấy sao? ☕️</p>
        <img class="post__image" src="https://picsum.photos/seed/aloute-desk/700/420" alt="ảnh bài viết">
        <div class="post__actions">
          <button class="action action--like is-liked" onclick="toggleLike(this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.2s-7.2-4.4-9-9C1.7 7.6 3.2 5 6 4.6c1.9-.3 3.4.6 4.3 1.9.6-.9 1.5-1.6 2.5-1.9 2.9-.6 4.9 2 4.5 4.6-.7 4.7-9.3 10.5-9.3 10.5Z"/></svg>
            <span>1,2K</span>
          </button>
          <button class="action action--reply">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-8.6 8.4c-1.3 0-2.6-.3-3.7-.9L3 20l1.1-5.4a8.3 8.3 0 0 1-.7-3.1A8.4 8.4 0 0 1 12.1 3a8.4 8.4 0 0 1 8.9 8.5Z"/></svg>
            <span>96</span>
          </button>
          <button class="action action--repost">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
            <span>8</span>
          </button>
          <button class="action action--share">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
            <span>5</span>
          </button>
        </div>
      </div>
      <button class="post__save" aria-label="Lưu bài viết">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12v17l-6-4-6 4V4Z"/></svg>
      </button>
    </div>

  </div>
</section>
</body>
</html>
