<div class="modal-overlay" id="videoCallModal" hidden th:fragment="callDialog" xmlns:th="http://www.thymeleaf.org" role="dialog" aria-modal="true" aria-labelledby="videoCallTitle">
    <div class="modal-card video-call-card">
      <div class="incoming-call-profile" id="incomingCallProfile" hidden>
        <img id="incomingCallAvatar" src="/images/avatar_default.png" alt="Người gọi">
      </div>
      <div class="modal-card__header">
        <h2 id="videoCallTitle">Cuộc gọi video</h2>
        <button type="button" class="modal-card__close" id="closeVideoCallBtn" aria-label="Đóng">&times;</button>
      </div>
      <div class="video-call-grid" id="videoCallGrid">
        <video id="remoteVideo" autoplay playsinline></video>
        <video id="localVideo" autoplay playsinline muted></video>
      </div>
      <div class="audio-call-profile" id="audioCallProfile" hidden>
        <img id="audioCallAvatar" src="/images/avatar_default.png" alt="Người gọi">
        <strong id="audioCallName">Cuộc gọi thoại</strong>
        <span>Không cần camera</span>
      </div>
      <div class="video-call-actions">
        <button type="button" class="btn-outline call-control" id="toggleMicBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg><span>Tắt mic</span></button>
        <button type="button" class="btn-outline call-control" id="toggleCameraBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 10.5 21 7v10l-6-3.5z"/><rect x="3" y="6" width="12" height="12" rx="2"/></svg><span>Tắt camera</span></button>
        <button type="button" class="btn-primary" id="answerCallBtn" hidden>Nhận cuộc gọi</button>
        <button type="button" class="btn-outline" id="rejectCallBtn" hidden>Từ chối</button>
        <button type="button" class="btn-danger" id="hangupCallBtn">Kết thúc</button>
      </div>
      <small id="videoCallStatus" class="field-hint">Sẵn sàng</small>
    </div>
  </div>
