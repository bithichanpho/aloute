<nav class="sidebar sidebar--fixed-rail" th:fragment="navbar">
    <div class="sidebar__panel">
        <a class="sidebar__logo" th:href="@{/feed}" aria-label="Aloute">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4.5 5.5h15v10h-8l-4.5 4v-4H4.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            </svg>
            <span>ALOUTE</span>
        </a>

        <div class="sidebar__nav">
            <a class="sidebar__row" th:classappend="${activeNav == 'feed'} ? 'sidebar__row--active' : ''" th:href="@{/feed}">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V21h-6v-6H9v6H3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
                <span class="sidebar__label">Trang chủ</span>
            </a>
            <a class="sidebar__row" th:classappend="${pageKind == 'stories'} ? 'sidebar__row--active' : ''" th:href="@{/stories}">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="m10 8 6 4-6 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
                <span class="sidebar__label">Tin 24 giờ</span>
            </a>
            <a class="sidebar__row" th:classappend="${activeNav == 'chat'} ? 'sidebar__row--active' : ''" th:href="@{/chat}">
                <span class="sidebar__icon-wrap">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 3-7.4 18-3.1-7.5L3 10.4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="m10.5 13.5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    <span id="chatUnreadBadge" class="badge" th:text="${unreadMessageCount > 99 ? '99+' : unreadMessageCount}" th:style="${unreadMessageCount > 0 ? '' : 'display:none'}">0</span>
                </span>
                <span class="sidebar__label">Tin nhắn</span>
            </a>
            <a class="sidebar__row" th:classappend="${activeNav == 'search'} ? 'sidebar__row--active' : ''" th:href="@{/search}">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16 16 5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                <span class="sidebar__label">Tìm kiếm</span>
            </a>
            <a class="sidebar__row" th:classappend="${activeNav == 'activity'} ? 'sidebar__row--active' : ''" th:href="@{/activity}">
                <span class="sidebar__icon-wrap">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21S4 16.4 4 9.8A4.8 4.8 0 0 1 12 6a4.8 4.8 0 0 1 8 3.8C20 16.4 12 21 12 21Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
                    <span id="notifUnreadBadge" class="badge" th:text="${unreadCount > 99 ? '99+' : unreadCount}" th:style="${unreadCount > 0 ? '' : 'display:none'}">0</span>
                </span>
                <span class="sidebar__label">Thông báo</span>
            </a>
            <a class="sidebar__row" th:classappend="${activeNav == 'compose'} ? 'sidebar__row--active' : ''" th:href="@{/compose}">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M4 12h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                <span class="sidebar__label">Tạo</span>
            </a>
            <a class="sidebar__row" th:classappend="${activeNav == 'profile'} ? 'sidebar__row--active' : ''" th:href="@{/profile/me}">
                <img src="/images/avatar_default.png" th:src="${currentUser != null and currentUser.avatarUrl != null ? currentUser.avatarUrl : '/images/avatar_default.png'}" alt="avatar"/>
                <span class="sidebar__label">Trang cá nhân</span>
            </a>
        </div>

        <section class="sidebar__section">
            <div class="sidebar__section-head"><span>Khám phá</span></div>
            <a class="sidebar__row sidebar__row--sub" th:classappend="${activeNav == 'communities'} ? 'sidebar__row--active' : ''" th:href="@{/communities}">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17" cy="9" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 20v-2a5 5 0 0 1 10 0v2M14 15.5a4 4 0 0 1 7 2.5v2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                <span class="sidebar__label">Hội nhóm</span>
            </a>
            <a class="sidebar__row sidebar__row--sub" th:classappend="${activeNav == 'saved'} ? 'sidebar__row--active' : ''" th:href="@{/saved}">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v17l-6-4-6 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
                <span class="sidebar__label">Đã lưu</span>
            </a>
            <a class="sidebar__row sidebar__row--sub" th:classappend="${pageKind == 'settings'} ? 'sidebar__row--active' : ''" th:href="@{/settings}">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
                <span class="sidebar__label">Cài đặt</span>
            </a>
        </section>

        <a id="logoutBtn" class="sidebar__row sidebar__more" th:href="@{/logout}">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H4v16h6M14 8l4 4-4 4M8 12h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="sidebar__label">Đăng xuất</span>
        </a>
    </div>
</nav>
