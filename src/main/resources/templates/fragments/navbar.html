<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- ===== Sidebar trái: đầy đủ (desktop) → thanh icon (tablet) → ẩn (mobile) ===== -->
<nav class="sidebar sidebar--fixed-rail" th:fragment="navbar" aria-label="Điều hướng chính">
    <div class="sidebar__panel">
        <a class="sidebar__logo" th:href="@{/feed}" aria-label="Aloute">
            <img class="sidebar__logo-icon" th:src="@{/images/aloute-bird-logo.png?v=20261027-bird-v1}"
                 src="/images/aloute-bird-logo.png" alt="">
            <span class="sidebar__label">ALOUTE</span>
        </a>

        <div class="sidebar__nav">
            <a class="sidebar__row" th:classappend="${activeNav == 'feed'} ? 'sidebar__row--active' : ''" th:href="@{/feed}" title="Trang chủ">
                <i class="bi" th:classappend="${activeNav == 'feed'} ? 'bi-house-door-fill' : 'bi-house-door'" aria-hidden="true"></i>
                <span class="sidebar__label">Trang chủ</span>
            </a>
            <a class="sidebar__row" th:classappend="${activeNav == 'chat'} ? 'sidebar__row--active' : ''" th:href="@{/chat}" title="Tin nhắn">
                <span class="sidebar__icon-wrap">
                    <i class="bi" th:classappend="${activeNav == 'chat'} ? 'bi-chat-dots-fill' : 'bi-chat-dots'" aria-hidden="true"></i>
                    <span id="chatUnreadBadge" class="badge" th:text="${unreadMessageCount > 99 ? '99+' : unreadMessageCount}" th:style="${unreadMessageCount > 0 ? '' : 'display:none'}">0</span>
                </span>
                <span class="sidebar__label">Tin nhắn</span>
            </a>
            <a class="sidebar__row" th:classappend="${activeNav == 'search'} ? 'sidebar__row--active' : ''" th:href="@{/search}" title="Tìm kiếm">
                <i class="bi bi-search" aria-hidden="true"></i>
                <span class="sidebar__label">Tìm kiếm</span>
            </a>
            <a class="sidebar__row" th:classappend="${activeNav == 'activity'} ? 'sidebar__row--active' : ''" th:href="@{/activity}" title="Thông báo">
                <span class="sidebar__icon-wrap">
                    <i class="bi" th:classappend="${activeNav == 'activity'} ? 'bi-heart-fill' : 'bi-heart'" aria-hidden="true"></i>
                    <span id="notifUnreadBadge" class="badge" th:text="${unreadCount > 99 ? '99+' : unreadCount}" th:style="${unreadCount > 0 ? '' : 'display:none'}">0</span>
                </span>
                <span class="sidebar__label">Thông báo</span>
            </a>
            <a class="sidebar__row" th:classappend="${activeNav == 'follow-requests'} ? 'sidebar__row--active' : ''" th:href="@{/follow-requests}" title="Yêu cầu theo dõi">
                <span class="sidebar__icon-wrap">
                    <i class="bi bi-person-plus" aria-hidden="true"></i>
                    <span id="followRequestBadge" class="badge" th:text="${followRequestCount > 99 ? '99+' : followRequestCount}" th:style="${followRequestCount > 0 ? '' : 'display:none'}">0</span>
                </span>
                <span class="sidebar__label">Yêu cầu theo dõi</span>
            </a>
            <a class="sidebar__row" th:classappend="${activeNav == 'compose'} ? 'sidebar__row--active' : ''" th:href="@{/compose}" title="Tạo">
                <i class="bi" th:classappend="${activeNav == 'compose'} ? 'bi-plus-square-fill' : 'bi-plus-square'" aria-hidden="true"></i>
                <span class="sidebar__label">Tạo</span>
            </a>
            <a class="sidebar__row" th:classappend="${activeNav == 'profile'} ? 'sidebar__row--active' : ''" th:href="@{/profile/me}" title="Trang cá nhân">
                <img src="/images/avatar_default.png" th:src="${currentUser != null and currentUser.avatarUrl != null ? currentUser.avatarUrl : '/images/avatar_default.png'}" alt="avatar"/>
                <span class="sidebar__label">Trang cá nhân</span>
            </a>
        </div>

        <section class="sidebar__section">
            <div class="sidebar__section-head"><span class="sidebar__label">Khám phá</span></div>
            <a class="sidebar__row sidebar__row--sub" th:classappend="${activeNav == 'communities'} ? 'sidebar__row--active' : ''" th:href="@{/communities}" title="Hội nhóm">
                <i class="bi" th:classappend="${activeNav == 'communities'} ? 'bi-people-fill' : 'bi-people'" aria-hidden="true"></i>
                <span class="sidebar__label">Hội nhóm</span>
            </a>
            <a class="sidebar__row sidebar__row--sub" th:classappend="${activeNav == 'saved'} ? 'sidebar__row--active' : ''" th:href="@{/saved}" title="Đã lưu">
                <i class="bi" th:classappend="${activeNav == 'saved'} ? 'bi-bookmark-fill' : 'bi-bookmark'" aria-hidden="true"></i>
                <span class="sidebar__label">Đã lưu</span>
            </a>
            <a class="sidebar__row sidebar__row--sub" th:classappend="${pageKind == 'settings'} ? 'sidebar__row--active' : ''" th:href="@{/settings}" title="Cài đặt">
                <i class="bi" th:classappend="${pageKind == 'settings'} ? 'bi-gear-fill' : 'bi-gear'" aria-hidden="true"></i>
                <span class="sidebar__label">Cài đặt</span>
            </a>
            <a class="sidebar__row sidebar__row--sub" th:if="${isSystemAdmin == true}" th:classappend="${pageKind == 'moderation'} ? 'sidebar__row--active' : ''" th:href="@{/admin/moderation}" title="Kiểm duyệt và báo cáo">
                <i class="bi bi-flag" aria-hidden="true"></i>
                <span class="sidebar__label">Kiểm duyệt &amp; báo cáo</span>
            </a>
            <a class="sidebar__row sidebar__row--sub" th:if="${isHost == true}" th:classappend="${activeNav == 'host-dashboard'} ? 'sidebar__row--active' : ''" th:href="@{/admin/dashboard}" title="Quản trị máy chủ">
                <i class="bi bi-speedometer2" aria-hidden="true"></i>
                <span class="sidebar__label">Quản trị máy chủ</span>
            </a>
        </section>

        <div class="sidebar__footer">
            <!-- Công tắc sáng/tối: ui.js bắt sự kiện bằng data-theme-toggle (delegation) -->
            <button type="button" class="sidebar__row sidebar__theme" data-theme-toggle title="Chuyển giao diện sáng/tối" aria-label="Chuyển giao diện sáng/tối">
                <span th:replace="~{fragments/theme-switch :: icon}"></span>
                <span class="sidebar__label">
                    <span class="theme-text theme-text--to-dark">Giao diện tối</span>
                    <span class="theme-text theme-text--to-light">Giao diện sáng</span>
                </span>
            </button>
            <a id="logoutBtn" class="sidebar__row sidebar__more" th:href="@{/logout}" title="Đăng xuất">
                <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
                <span class="sidebar__label">Đăng xuất</span>
            </a>
        </div>
    </div>
</nav>

<!-- ===== Thanh trên cho mobile: logo, tìm kiếm, đổi theme, menu "thêm" ===== -->
<header class="mobile-topbar" th:fragment="mobileTopbar">
    <a class="mobile-topbar__logo" th:href="@{/feed}" aria-label="Aloute">
        <img class="mobile-topbar__logo-icon" th:src="@{/images/aloute-bird-logo.png?v=20261027-bird-v1}"
             src="/images/aloute-bird-logo.png" alt="">
        <span>ALOUTE</span>
    </a>
    <div class="mobile-topbar__actions">
        <a class="mobile-topbar__btn" th:href="@{/search}" aria-label="Tìm kiếm"><i class="bi bi-search"></i></a>
        <button type="button" class="mobile-topbar__btn" data-theme-toggle aria-label="Chuyển giao diện sáng/tối">
            <span th:replace="~{fragments/theme-switch :: icon}"></span>
        </button>
        <div class="dropdown">
            <button type="button" class="mobile-topbar__btn" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Thêm">
                <i class="bi bi-list"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow">
                <li><a class="dropdown-item" th:href="@{/communities}"><i class="bi bi-people me-2"></i>Hội nhóm</a></li>
                <li><a class="dropdown-item" th:href="@{/saved}"><i class="bi bi-bookmark me-2"></i>Đã lưu</a></li>
                <li><a class="dropdown-item" th:href="@{/settings}"><i class="bi bi-gear me-2"></i>Cài đặt</a></li>
                <li th:if="${isSystemAdmin == true}"><a class="dropdown-item" th:href="@{/admin/moderation}"><i class="bi bi-flag me-2"></i>Báo cáo vi phạm</a></li>
                <li th:if="${isHost == true}"><a class="dropdown-item" th:href="@{/admin/dashboard}"><i class="bi bi-speedometer2 me-2"></i>Quản trị máy chủ</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item text-danger" th:href="@{/logout}" data-logout="1"><i class="bi bi-box-arrow-right me-2"></i>Đăng xuất</a></li>
            </ul>
        </div>
    </div>
</header>

</body>
</html>
