
<html th:replace="~{layout/base :: layout(~{::title}, ~{::section})}" xmlns:th="http://www.thymeleaf.org">
<head><title th:text="${community.name} + ' - ALOUTE'">Hội nhóm - ALOUTE</title></head>
<body>
<section class="content-inner community-page" th:attr="data-community-id=${community.id}">

  <a class="community-back" href="/communities" th:href="@{/communities}">&larr; Tất cả hội nhóm</a>

  <div class="community-cover">
    <img th:if="${community.coverUrl != null}" th:src="${community.coverUrl}" alt="ảnh bìa hội nhóm">
  </div>

  <div class="community-header">
    <span class="community-header__avatar">
      <img th:if="${community.avatarUrl != null}" th:src="${community.avatarUrl}" alt="avatar hội nhóm">
      <span th:unless="${community.avatarUrl != null}" th:text="${#strings.substring(community.name,0,1).toUpperCase()}">H</span>
    </span>
    <div class="community-header__body">
      <h1 th:text="${community.name}">Tên hội nhóm</h1>
      <p class="community-header__meta"
         th:text="${community.memberCount + ' thành viên · ' + (community.privacy == 'PRIVATE' ? 'Riêng tư' : 'Công khai')}">0 thành viên</p>
      <p class="community-header__desc" th:if="${community.description != null}" th:text="${community.description}"></p>
    </div>
    <div class="community-header__actions">
      <button type="button" id="communityJoinBtn" class="btn-primary" th:if="${!community.member}">Tham gia</button>
      <button type="button" id="communityLeaveBtn" class="btn-outline" th:if="${community.member}">Rời hội nhóm</button>
    </div>
  </div>

  <div class="feed-panel" th:if="${community.member}">
    <div class="compose">
      <img class="compose__avatar"
           th:src="${currentUser != null and currentUser.avatarUrl != null ? currentUser.avatarUrl : '/images/avatar_default.png'}"
           src="/images/avatar_default.png" alt="avatar của tôi">
      <div class="compose__body">
        <input class="compose__placeholder" id="communityComposeInput" type="text"
               th:attr="placeholder='Đăng gì đó trong ' + ${community.name} + '...'">
      </div>
      <button class="btn-post" id="communityComposeBtn" disabled>Đăng</button>
    </div>
  </div>

  <div class="feed-panel" id="communityFeedPanel">
    <div class="empty-state" th:if="${feedLocked}">
      Đây là hội nhóm riêng tư. Tham gia để xem bài viết bên trong.
    </div>
    <div th:if="${!feedLocked and #lists.isEmpty(posts)}" class="empty-state">
      Chưa có bài viết nào trong hội nhóm này. Hãy là người đầu tiên chia sẻ!
    </div>

    <div th:replace="~{feed/index :: .post}"></div>

    <button type="button" class="btn-outline" data-load-posts
            th:if="${#lists.size(posts) == 20}"
            th:attr="data-url=@{'/api/communities/' + ${community.id} + '/posts/fragment'}">Tải thêm</button>
  </div>

</section>
</body>
</html>
