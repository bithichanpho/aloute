spring:
  docker:
    compose:
      enabled: false
# Development profile for calling over one Wi-Fi/LAN using a single backend instance.
# Both browsers must connect to this same backend over HTTPS; do not run separate app backends.
server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8080}
  ssl:
    enabled: true
    key-store: "${ALOUTE_LAN_KEYSTORE:file:./dev-certs/aloute-lan.p12}"
    key-store-password: "${ALOUTE_LAN_KEYSTORE_PASSWORD:}"
    key-store-type: PKCS12

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://localhost:8080}
  security:
    cookie-secure: true
    rate-limit:
      redis-required: false
  websocket:
    broker-relay:
      enabled: false
  calls:
    distributed-state-enabled: false
  webrtc:
    stun-urls: ${APP_WEBRTC_STUN_URLS:stun:stun.l.google.com:19302}
    turn-urls: ${APP_WEBRTC_TURN_URLS:}
    turn-shared-secret: ${APP_WEBRTC_TURN_SHARED_SECRET:}
