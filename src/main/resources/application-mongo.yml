# Spring Boot chỉ bind URI MongoDB ở khóa "spring.data.mongodb.uri".
# Bản cũ dùng "spring.mongodb.uri" — khóa đó KHÔNG được bind, nên biến môi trường
# MONGO_URI bị bỏ qua và ứng dụng lặng lẽ nối vào mongodb://localhost:27017/test.
# Bản merge này dùng đúng khóa. NẾU dữ liệu cũ của bạn đang nằm ở database "test",
# hãy dump/restore sang aloute_db (hoặc trỏ MONGO_URI về đúng database cũ) trước khi chạy.
spring:
  data:
    mongodb:
      auto-index-creation: true
  mongodb:
    uri: ${MONGO_URI:mongodb://localhost:27017/aloute_db}
    # Tự tạo index khai báo bằng @Indexed/@CompoundIndex trong Post, Like, ChatMessage.
    # Từ Spring Boot 3 mặc định là false; không bật thì feed/chat phải quét cả collection.
