spring:
  application:
    name: aloute
  servlet:
    multipart:
      max-file-size: ${ALOUTE_MAX_UPLOAD_SIZE:2GB}
      max-request-size: ${ALOUTE_MAX_UPLOAD_SIZE:2GB}
      file-size-threshold: 2MB
  config:
    import:
      - application-db.yml
      - application-mongo.yml
      - application-jwt.yml
      - application-mail.yml
      - application-cloudinary.yml
      - application-actuator.yml

server:
  port: 8889

app:
  upload:
    max-file-size: ${ALOUTE_MAX_UPLOAD_SIZE:2GB}
