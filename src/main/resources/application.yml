spring:
  application:
    name: aloute
  servlet:
    multipart:
      max-file-size: ${ALOUTE_MAX_UPLOAD_SIZE:2GB}
      max-request-size: ${ALOUTE_MAX_UPLOAD_SIZE:2GB}
      file-size-threshold: 2MB

  thymeleaf:
    cache: ${THYMELEAF_CACHE:false}

  web:
    resources:

      chain:
        enabled: true
        cache: true
        compressed: true
        strategy:
          content:
            enabled: true
            paths: /**
      cache:
        cachecontrol:
          max-age: ${STATIC_CACHE_MAX_AGE:0s}
          cache-public: ${STATIC_CACHE_PUBLIC:false}

  jpa:

    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 30
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true

  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:15}
      minimum-idle: ${DB_POOL_MIN:3}
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      keepalive-time: 120000

  data:
    mongodb:

      auto-index-creation: true
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

  config:
    import:
      - optional:file:.env[.properties]
      - application-db.yml
      - application-mongo.yml
      - application-jwt.yml
      - application-mail.yml
      - application-cloudinary.yml
      - application-actuator.yml

server:
  port: 8080

  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,image/svg+xml
    min-response-size: 1024

  http2:
    enabled: true

  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:150}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS:15}
    max-connections: 8192
    accept-count: 200
    connection-timeout: 20s

app:
  security:
    cookie-secure: ${APP_SECURITY_COOKIE_SECURE:false}
  firebase:
    web:
      api-key: ${FIREBASE_WEB_API_KEY:}
      auth-domain: ${FIREBASE_WEB_AUTH_DOMAIN:}
      project-id: ${FIREBASE_PROJECT_ID:}
      storage-bucket: ${FIREBASE_STORAGE_BUCKET:}
      messaging-sender-id: ${FIREBASE_MESSAGING_SENDER_ID:}
      app-id: ${FIREBASE_WEB_APP_ID:}
      vapid-key: ${FIREBASE_VAPID_KEY:}
    admin:
      project-id: ${FIREBASE_PROJECT_ID:}
      credentials-path: ${FIREBASE_ADMIN_CREDENTIALS:}
  cache:
    redis:
      enabled: ${REDIS_CACHE_ENABLED:false}
    ttl: ${APP_CACHE_TTL:2m}
  seed:
    demo-data: ${ALOUTE_SEED_DEMO_DATA:true}
  upload:
    max-file-size: ${ALOUTE_MAX_UPLOAD_SIZE:2GB}
  db:
    relationship-migration:
      enabled: ${ALOUTE_DB_RELATIONSHIP_MIGRATION:true}
