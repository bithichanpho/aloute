services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      # Containers cannot use localhost to reach a database on the host. Set COMPOSE_DB_URL
      # to this Docker-reachable address, or to your managed PostgreSQL JDBC URL in production.
      DB_URL: ${COMPOSE_DB_URL:-jdbc:postgresql://host.docker.internal:5432/aloute}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
      RATE_LIMIT_REDIS_REQUIRED: "true"
      MODERATION_SERVICE_URL: http://moderation:8000
      MODERATION_API_TOKEN: ${MODERATION_API_TOKEN:?Set a unique 32+ byte MODERATION_API_TOKEN in .env}
      MODERATION_CONNECT_TIMEOUT: ${MODERATION_CONNECT_TIMEOUT:-2s}
      MODERATION_READ_TIMEOUT: ${MODERATION_READ_TIMEOUT:-60s}
      MODERATION_TEXT_TIMEOUT: ${MODERATION_TEXT_TIMEOUT:-10s}
      MODERATION_MAX_ATTEMPTS: ${MODERATION_MAX_ATTEMPTS:-5}
      MODERATION_RETRY_BASE_DELAY_SECONDS: ${MODERATION_RETRY_BASE_DELAY_SECONDS:-30}
      MODERATION_LEASE_SECONDS: ${MODERATION_LEASE_SECONDS:-300}
      APP_SECURITY_ENCRYPTION_KEY: ${APP_SECURITY_ENCRYPTION_KEY:?Set a unique 32+ byte APP_SECURITY_ENCRYPTION_KEY in .env}
      # Shared call state and STOMP relay are mandatory when app replicas are scaled.
      APP_CALLS_DISTRIBUTED_STATE_ENABLED: "true"
      APP_WEBSOCKET_BROKER_RELAY_ENABLED: "true"
      APP_WEBSOCKET_BROKER_RELAY_HOST: ${APP_WEBSOCKET_BROKER_RELAY_HOST:-rabbitmq}
      APP_WEBSOCKET_BROKER_RELAY_PORT: ${APP_WEBSOCKET_BROKER_RELAY_PORT:-61613}
      APP_WEBSOCKET_BROKER_RELAY_USERNAME: ${RABBITMQ_USER:-aloute}
      APP_WEBSOCKET_BROKER_RELAY_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      APP_WEBSOCKET_BROKER_RELAY_VIRTUAL_HOST: ${RABBITMQ_VHOST:-/}
      APP_WEBRTC_TURN_URLS: ${APP_WEBRTC_TURN_URLS:-turn:${TURN_PUBLIC_HOST:-localhost}:3478?transport=udp,turn:${TURN_PUBLIC_HOST:-localhost}:3478?transport=tcp}
      APP_WEBRTC_TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:?Set TURN_SHARED_SECRET in .env}
      # The service-account JSON is mounted read-only at a stable in-container path;
      # FIREBASE_ADMIN_CREDENTIALS in the host .env remains a host filesystem path.
      FIREBASE_ADMIN_CREDENTIALS: /run/secrets/firebase-admin.json
      # The app port is bound to host loopback only. Configure only the immediate Nginx
      # proxy IP as trusted; verify the socket peer address in your deployment environment.
      APP_TRUSTED_PROXY_CIDRS: ${APP_TRUSTED_PROXY_CIDRS:-172.29.0.1/32,127.0.0.1/32,::1/128}
    volumes:
      - type: bind
        source: ${FIREBASE_ADMIN_CREDENTIALS:?Set FIREBASE_ADMIN_CREDENTIALS to the host JSON path in .env}
        target: /run/secrets/firebase-admin.json
        read_only: true
    expose:
      - "8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - aloute-backend
    depends_on:
      redis:
        condition: service_healthy
      moderation:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    deploy:
      replicas: ${APP_REPLICAS:-2}

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./deploy/nginx/docker.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8085:80"
    networks:
      - aloute-backend
    depends_on:
      app:
        condition: service_healthy

  moderation:
    build:
      context: ./moderation
      dockerfile: Dockerfile
    container_name: aloute-moderation
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      OPENAI_MODERATION_MODEL: ${OPENAI_MODERATION_MODEL:-omni-moderation-latest}
      OPENAI_MODERATION_TIMEOUT_SECONDS: ${OPENAI_MODERATION_TIMEOUT_SECONDS:-8}
      OPENAI_AUDIO_TIMEOUT_SECONDS: ${OPENAI_AUDIO_TIMEOUT_SECONDS:-15}
      OPENAI_AUDIO_MODEL: ${OPENAI_AUDIO_MODEL:-gpt-4o-mini-transcribe}
      MODERATION_API_TOKEN: ${MODERATION_API_TOKEN:?Set a unique 32+ byte MODERATION_API_TOKEN in .env}
      MODERATION_ALLOWED_MEDIA_HOSTS: ${MODERATION_ALLOWED_MEDIA_HOSTS:-res.cloudinary.com}
      LOG_LEVEL: ${MODERATION_LOG_LEVEL:-INFO}
    networks:
      - aloute-backend
    # Loopback-only mapping supports running the Java process directly on the host.
    # The app container uses http://moderation:8000 on the private network instead.
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()"]
      interval: 20s
      timeout: 4s
      retries: 3
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: aloute-rabbitmq
    restart: unless-stopped
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-aloute}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    command: ["sh", "-c", "rabbitmq-plugins enable --offline rabbitmq_stomp rabbitmq_management && rabbitmq-server"]
    networks:
      - aloute-backend
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    # No host ports: only app containers on the private Compose network can reach AMQP/STOMP.

  redis:
    image: redis:7-alpine
    container_name: aloute-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    volumes:
      - aloute-redis-data:/data
    networks:
      - aloute-backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping 2>/dev/null | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    # No host port: Redis is accessible only to services on this Compose network.

  turn:
    image: coturn/coturn:4.6-alpine
    container_name: aloute-turn
    restart: unless-stopped
    command:
      - --no-cli
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET:?Set TURN_SHARED_SECRET in .env}
      - --realm=${TURN_REALM:-aloute.local}
      - --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --no-multicast-peers
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    networks:
      - aloute-backend

networks:
  aloute-backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24

volumes:
  aloute-redis-data:
