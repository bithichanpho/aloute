name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: aloute
          POSTGRES_USER: aloute
          POSTGRES_PASSWORD: aloute
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aloute"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_URL: jdbc:postgresql://localhost:5432/aloute
      DB_USERNAME: aloute
      DB_PASSWORD: aloute
      DB_DDL_AUTO: create-drop
      REDIS_URL: redis://localhost:6379
      REDIS_CACHE_ENABLED: true
      RATE_LIMIT_REDIS_REQUIRED: true
      ALOUTE_SCHEMA_VALIDATION_URL: jdbc:postgresql://localhost:5432/aloute_schema_validation
      ALOUTE_SCHEMA_VALIDATION_USERNAME: aloute
      ALOUTE_SCHEMA_VALIDATION_PASSWORD: aloute
      ALOUTE_SEED_DEMO_DATA: false
      ALOUTE_DB_RELATIONSHIP_MIGRATION: false
      CLOUDINARY_CLOUD_NAME: test
      CLOUDINARY_API_KEY: test
      CLOUDINARY_API_SECRET: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Create a fresh database for Flyway/Hibernate schema validation
        run: PGPASSWORD=aloute psql -h 127.0.0.1 -U aloute -d aloute -v ON_ERROR_STOP=1 -c "CREATE DATABASE aloute_schema_validation"
      - name: Test, validate the fresh schema, and package
        run: ./mvnw --batch-mode -Pcoverage clean verify
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: error
