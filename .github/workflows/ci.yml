name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: aloute
          POSTGRES_USER: aloute
          POSTGRES_PASSWORD: aloute
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aloute"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_URL: jdbc:postgresql://localhost:5432/aloute
      DB_USERNAME: aloute
      DB_PASSWORD: aloute
      DB_DDL_AUTO: create-drop
      MONGO_URI: mongodb://localhost:27017/aloute_test
      REDIS_URL: redis://localhost:6379
      REDIS_CACHE_ENABLED: true
      ALOUTE_SEED_DEMO_DATA: false
      ALOUTE_DB_RELATIONSHIP_MIGRATION: false
      CLOUDINARY_CLOUD_NAME: test
      CLOUDINARY_API_KEY: test
      CLOUDINARY_API_SECRET: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Test and package
        run: ./mvnw --batch-mode -Pcoverage clean verify
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: error
