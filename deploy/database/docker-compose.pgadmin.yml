services:
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: aloute-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@aloute.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in deploy/database/.env.pgadmin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - aloute_pgadmin_data:/var/lib/pgadmin

volumes:
  aloute_pgadmin_data:
